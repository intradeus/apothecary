apiVersion: 1

datasources:
  - name: Apothecary Events (Postgres)
    uid: apothecary-pg
    type: grafana-postgresql-datasource
    url: 127.0.0.1:15432
    user: apothecary
    database: apothecary
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    isDefault: true

  - name: Apothecary Metrics (Prometheus)
    uid: apothecary-prom
    type: prometheus
    url: http://127.0.0.1:19090
