# Local observability stack, dev/demo only: grafana/otel-lgtm bundles an
# OTLP collector, Prometheus, Tempo, Loki and Grafana in one image.
# Production points the engine's OTEL_* variables at the operator's own
# backend instead. Ports bind loopback only, offset from the standard ones
# (a host often runs its own Grafana/Prometheus):
#   OTLP gRPC 14317, OTLP HTTP 14318, Grafana 3001, Prometheus 19090.
# Run the engine with
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:14317 OTEL_EXPORTER_OTLP_PROTOCOL=grpc
# Grafana also reads the engine's Postgres (the run_facts/stage_attempts
# fact tables) through the apothecary-pg datasource: set
# APOTHECARY_PG_PASSWORD (deploy/.env) and, if it is not the local dev
# database, APOTHECARY_PG_ADDR.
services:
  lgtm:
    image: grafana/otel-lgtm@sha256:4c8056c9c05fcb3c8fd93800e85334bfd79b4d0271b47a54a121a64af41fe1fe
    ports:
      - '127.0.0.1:14317:4317'
      - '127.0.0.1:14318:4318'
      - '127.0.0.1:3001:3000'
      - '127.0.0.1:19090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      APOTHECARY_PG_ADDR: ${APOTHECARY_PG_ADDR:-host.docker.internal:15432}
      APOTHECARY_PG_PASSWORD: ${APOTHECARY_PG_PASSWORD}
    volumes:
      - ./grafana/provisioning/datasources/apothecary.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/apothecary.yaml:ro
      - ./grafana/provisioning/dashboards/apothecary.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/apothecary.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/apothecary-dashboards:ro
