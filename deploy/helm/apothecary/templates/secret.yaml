{{- if not .Values.existingSecret }}
{{- $dsn := .Values.externalDSN -}}
{{- if .Values.postgres.enabled -}}
{{- $dsn = printf "postgres://%s:%s@apothecary-postgres.%s.svc:5432/%s?sslmode=disable" .Values.postgres.user (required "postgres.password is required" .Values.postgres.password) .Release.Namespace .Values.postgres.database -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: apothecaryd
  labels:
    {{- include "apothecary.labels" . | nindent 4 }}
type: Opaque
stringData:
  APOTHECARY_MASTER_KEY: {{ required "masterKey is required (apothecaryd keygen), or set existingSecret" .Values.masterKey | quote }}
  APOTHECARY_POSTGRES_DSN: {{ required "a Postgres DSN is required: enable postgres or set externalDSN" $dsn | quote }}
{{- end }}
