{{- if .Values.workspaces.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.workspaces.namespace }}
  labels:
    {{- include "apothecary.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: {{ .Values.workspaces.podSecurity }}
    pod-security.kubernetes.io/warn: {{ .Values.workspaces.podSecurity }}
{{- end }}
