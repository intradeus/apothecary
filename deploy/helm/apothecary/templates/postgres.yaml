{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: apothecary-postgres
  labels:
    {{- include "apothecary.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: apothecary-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apothecary-postgres
  labels:
    {{- include "apothecary.labels" . | nindent 4 }}
spec:
  serviceName: apothecary-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apothecary-postgres
  template:
    metadata:
      labels:
        {{- include "apothecary.labels" . | nindent 8 }}
        app.kubernetes.io/name: apothecary-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, {{ .Values.postgres.user | quote }}]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
