# Local development on k3d (task k8s:cluster k8s:images k8s:deploy).
image:
  repository: k3d-registry.localhost:5111/apothecary
  tag: local
  pullPolicy: Always    # :local is rebuilt in place

# The master key comes from `task k8s:deploy` (a generated, git-ignored
# deploy/.k3d-master-key); the database password is a throwaway's.
postgres:
  enabled: true
  password: apothecary

engine:
  runsDir:
    size: 10Gi

ingress:
  enabled: true
  className: traefik
  host: apothecary.localhost
  appsDomain: apps.localhost
  scheme: http
