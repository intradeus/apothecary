# Apothecary on Kubernetes. The chart deploys the ENGINE (and optionally a
# Postgres); the engine itself creates every workspace object at runtime —
# one sandbox pod per run, one egress gateway and one browser per project —
# in the workspaces namespace.

image:
  # Six images per release, all under this prefix: apothecaryd, sandbox,
  # shim, tools, egress-gw, browser (see deploy/images.sh).
  repository: ghcr.io/intradeus/apothecary
  tag: ""            # default: the chart's appVersion
  # The default tag is the mutable :latest, so nodes must re-pull it. With a
  # pinned image.tag (vX.Y.Z), IfNotPresent is enough.
  pullPolicy: Always
  # Per-image overrides (full references), e.g. a mirror.
  overrides:
    apothecaryd: ""
    sandbox: ""
    shim: ""
    tools: ""
    gateway: ""
    browser: ""
imagePullSecrets: []

# Secrets: the master key (`apothecaryd keygen`) and the Postgres DSN. Either
# set them here, or point existingSecret at a Secret holding the keys
# APOTHECARY_MASTER_KEY and APOTHECARY_POSTGRES_DSN.
masterKey: ""
existingSecret: ""

postgres:
  # A single-instance Postgres in the release's namespace. For production,
  # disable it and set externalDSN (or existingSecret).
  enabled: true
  image: postgres:16
  user: apothecary
  password: ""        # required when enabled
  database: apothecary
  storage: 10Gi
  storageClass: ""
externalDSN: ""

workspaces:
  # Where sandboxes, gateways and browsers live. Sandboxes are privileged
  # Docker-in-Docker pods unless a sysbox runtime class is used, so the
  # namespace must admit privileged pods.
  namespace: apothecary-workspaces
  createNamespace: true
  podSecurity: privileged
  # Destinations no workspace may reach through its gateway: the cluster's
  # pod and service ranges and link-local metadata. The defaults are k3s's.
  protectCIDRs: "10.42.0.0/16,10.43.0.0/16,169.254.0.0/16"
  clusterDomain: cluster.local

engine:
  replicas: 1          # one engine per workspaces namespace
  runsDir:
    size: 20Gi
    storageClass: ""
  portAutoExpose: false
  # Uploads (attachments on tickets, run goals, ping answers) and engine
  # captures. Empty = the engine's defaults: 25 MiB; text/*, common images,
  # PDF, JSON, Office documents; snapshots capped like uploads.
  uploads:
    maxBytes: ""
    mimeAllow: ""          # comma-separated, e.g. "text/*,image/png"
    snapshotMaxBytes: ""
  extraEnv: {}
  resources: {}
  nodeSelector: {}
  tolerations: []

service:
  type: ClusterIP

# Platform telemetry: traces, metrics and logs over OTLP to the operator's
# backend (any OTLP collector; the repo's otel-lgtm stack is for dev only).
# An empty endpoint exports nothing; protocol/headers/resourceAttributes
# render only alongside it, as the standard OTEL_* variables.
otel:
  endpoint: ""
  protocol: grpc
  headers: ""
  resourceAttributes: ""

# The engine's own log lines on stderr: json|text, debug|info|warn|error.
log:
  format: json
  level: info

# Where the admin's System hub links for the platform dashboards; "" hides
# the link behind a not-configured note.
grafanaUrl: ""

# The SSH door (TODO 46): one port people ssh to — desktop VS Code's
# Remote-SSH included — routed by username to a run's workspace. An Ingress
# cannot carry SSH: it needs a Service of its own (a LoadBalancer, a
# NodePort, or a tailscale-operator Service for the VPN case), and
# `advertise` is the host:port people connect to, what the run page prints.
ssh:
  enabled: false
  port: 2222
  advertise: ""
  service:
    type: LoadBalancer
    annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: apothecary.example.com
  # Exposed workspace ports are served at <port>-<run>.<appsDomain> by the
  # engine itself; point a wildcard record (and certificate) at the ingress.
  appsDomain: ""
  # The port browsers use when it is not the scheme's default (k3d: 8090).
  appsPort: ""
  scheme: https
  tls: []
  #  - secretName: apothecary-tls
  #    hosts: [apothecary.example.com, "*.apps.example.com"]
