# Apothecary reference deployment (DESIGN2.md §15).
#
#   cp deploy/env.example deploy/.env    # then fill APOTHECARY_MASTER_KEY (apothecaryd keygen)
#   docker compose -f deploy/docker-compose.yaml up -d
#
# Host network mode keeps 127.0.0.1:8080 and the Coder reverse tunnel
# byte-identical to a bare-metal install (the -R target is the engine's own
# loopback wherever it runs). Postgres binds a non-default loopback port
# (collision precedent: the observability stack). Coder itself is NOT
# bundled — it is an integration you configure in the UI.
services:
  postgres:
    image: postgres:16
    network_mode: host
    environment:
      POSTGRES_USER: apothecary
      POSTGRES_PASSWORD: ${APOTHECARY_PG_PASSWORD:?set APOTHECARY_PG_PASSWORD in deploy/.env}
      POSTGRES_DB: apothecary
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "port=15432"]
    volumes:
      - apothecary-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 15432 -U apothecary"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  apothecaryd:
    # Runs the published release image (CI pushes :latest and :v2.0.N on
    # every main push). Pin a version — or point at a local build from
    # deploy/release.sh — via APOTHECARY_IMAGE in deploy/.env.
    image: ${APOTHECARY_IMAGE:-ghcr.io/intradeus/apothecary/apothecaryd:latest}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APOTHECARY_POSTGRES_DSN: postgres://apothecary:${APOTHECARY_PG_PASSWORD}@127.0.0.1:15432/apothecary
      APOTHECARY_MASTER_KEY: ${APOTHECARY_MASTER_KEY:?run `apothecaryd keygen` and set APOTHECARY_MASTER_KEY in deploy/.env}
      APOTHECARY_LISTEN: 127.0.0.1:8080
    volumes:
      # Workspace image builds (§8) go through the host's docker daemon —
      # the same one Coder's docker provider uses. This makes the engine
      # root-equivalent on the host: documented §16 residual, it joins
      # Coder as literal trusted control plane.
      - /var/run/docker.sock:/var/run/docker.sock
      - apothecary-runs:/var/lib/apothecary/runs
    restart: unless-stopped

volumes:
  apothecary-pgdata:
  apothecary-runs:
