# Apothecary reference deployment (DESIGN2.md §15).
#
#   cp deploy/.env.example deploy/.env    # then fill APOTHECARY_MASTER_KEY (apothecaryd keygen)
#   docker compose -f deploy/docker-compose.yaml up -d
#
# Host network mode keeps 127.0.0.1:8080 byte-identical to a bare-metal
# install. Postgres binds a non-default loopback port (collision precedent:
# the observability stack).
services:
  postgres:
    image: postgres:16
    network_mode: host
    environment:
      POSTGRES_USER: apothecary
      POSTGRES_PASSWORD: ${APOTHECARY_PG_PASSWORD:?set APOTHECARY_PG_PASSWORD in deploy/.env}
      POSTGRES_DB: apothecary
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "port=15432"]
    volumes:
      - apothecary-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 15432 -U apothecary"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  apothecaryd:
    # Runs the newest release (manual-release pushes :latest and :vX.Y.Z on
    # each approved release). Pin one with
    # APOTHECARY_IMAGE=ghcr.io/intradeus/apothecary/apothecaryd:vX.Y.Z in
    # deploy/.env.
    image: ${APOTHECARY_IMAGE:-ghcr.io/intradeus/apothecary/apothecaryd:latest}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    # Every optional engine variable set in deploy/.env reaches the engine:
    # log format/level, OTEL_*, APOTHECARY_PUBLIC_URL, upload limits,
    # APOTHECARY_SANDBOX_RUNTIME (see deploy/.env.example). The environment:
    # entries below win over it.
    #
    # Opt-in hardening: with sysbox installed on the HOST, set
    # APOTHECARY_SANDBOX_RUNTIME=sysbox-runc in deploy/.env and each run's
    # DinD sandbox drops --privileged for a user namespace — a compromised run
    # then can't reach the host, its docker socket, or any other run. Empty =
    # today's privileged sandbox. Linux-only (see deploy/.env.example).
    #
    # Docker in workspaces (README, "Docker in workspaces"):
    # APOTHECARY_WORKSPACE_DOCKER=auto|on|off in deploy/.env. auto (default)
    # hands a run's own daemon to a docker-outside-of-docker devcontainer only
    # under sysbox; on does so under privileged sandboxes too — such a
    # workspace is then root on this host (a laptop instance's call, not a
    # shared server's); off never.
    env_file: [.env]
    environment:
      APOTHECARY_POSTGRES_DSN: postgres://apothecary:${APOTHECARY_PG_PASSWORD}@127.0.0.1:15432/apothecary
      APOTHECARY_MASTER_KEY: ${APOTHECARY_MASTER_KEY:?run `apothecaryd keygen` and set APOTHECARY_MASTER_KEY in deploy/.env}
      APOTHECARY_LISTEN: 127.0.0.1:8080
      # The SSH door (desktop VS Code / ssh into a run's workspace): bind the
      # address people reach the engine at over the VPN — not 0.0.0.0, this
      # container shares the host's network — and advertise the name they
      # connect to. Unset = no door.
      # APOTHECARY_SSH_LISTEN: 100.64.0.9:2222
      # APOTHECARY_SSH_ADVERTISE: engine.tail1234.ts.net:2222
    volumes:
      # Workspace image builds (§8) go through the host's docker daemon.
      # This makes the engine root-equivalent on the host: documented §16
      # residual, it is literal trusted control plane.
      - /var/run/docker.sock:/var/run/docker.sock
      # RunsDir is a HOST BIND MOUNT at the SAME path (not a named volume):
      # the devcontainer provisioner asks the host daemon to bind-mount the
      # engine-side checkout + shim dir (and the engine-bridge unix sockets)
      # from here INTO each workspace container, and the daemon resolves
      # those source paths host-side — a named volume would surface empty
      # dirs.
      # This dir is a rebuildable cache (logs, checkouts, build artifacts);
      # the durable state is Postgres.
      - /var/lib/apothecary/runs:/var/lib/apothecary/runs
    restart: unless-stopped

volumes:
  apothecary-pgdata:
