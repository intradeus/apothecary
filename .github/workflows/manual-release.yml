# manual-release: run by hand (Actions → manual-release → Run workflow, on
# main) whenever a release is wanted; it cuts the next semver release of
# main's head (rules in .cz.toml; deploy/release.sh does the work). Nothing
# triggers it on its own.
#
#   plan     refuses a commit whose `ci` run did not pass, then says what it
#            would release: release vX.Y.Z (with its notes), resume (the tag
#            exists, its images did not all land), none (only
#            docs/test/ci/style since the last tag) or superseded (main moved
#            on while this ran; run it again)
#   release  commit CHANGELOG.md + tag vX.Y.Z, build the five images, push main
#            and the tag atomically, then push the images as vX.Y.Z,
#            sha-<short> and latest (latest only for the newest release),
#            then the Helm chart as oci://ghcr.io/intradeus/charts/apothecary
#            X.Y.Z (pinned to those images), and last create the GitHub Release
#            vX.Y.Z (its CHANGELOG section, the images' pull commands, the
#            chart's install command and the apothecary client's binaries)
#
# The release commit carries [skip ci], so it starts no ci run of its own.
name: manual-release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # plan: the ci run of the commit

env:
  COMMITIZEN_VERSION: 4.19.3

defaults:
  run:
    # bash -eo pipefail: a failing plan must not hide behind `| tee`.
    shell: bash

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require a green ci run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq .total_count)
          if [ "$n" = 0 ]; then
            echo "::error title=manual-release::ci has not passed on $SHA (main's head); wait for it or fix it, then run again"
            exit 1
          fi
      - run: pipx install "commitizen==${COMMITIZEN_VERSION}"
      - id: plan
        env:
          RELEASE_NOTES_FILE: ${{ runner.temp }}/notes.md
        run: deploy/release.sh plan "$SHA" | tee -a "$GITHUB_OUTPUT"
      - name: Summary
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          {
            echo "## manual-release: $MODE $VERSION"
            echo
            case "$MODE" in
              release) cat "$RUNNER_TEMP/notes.md" ;;
              resume) echo "Tag exists; re-publishing its images." ;;
              none) echo "No commit since the last tag bumps the version (docs/test/ci/style only)." ;;
              superseded) echo "main moved past this commit while this ran; run manual-release again." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: plan
    if: needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'resume'
    runs-on: ubuntu-26.04
    concurrency:
      group: manual-release
      # Never cancel: a release can be partway through pushing.
      cancel-in-progress: false
    permissions:
      contents: write # push the release commit and tag to main
      packages: write # push to ghcr
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - run: pipx install "commitizen==${COMMITIZEN_VERSION}"
      # Check the state again: main can move between the two jobs.
      - id: plan
        run: deploy/release.sh plan "$SHA" | tee -a "$GITHUB_OUTPUT"
      - name: Nothing to release
        if: steps.plan.outputs.mode != 'release' && steps.plan.outputs.mode != 'resume'
        env:
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          echo "::notice title=manual-release::$MODE: main is at $(git rev-parse --short origin/main); run manual-release again to release it"
      - name: Cut the release
        if: steps.plan.outputs.mode == 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag=$(deploy/release.sh cut)
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Check out the existing release
        if: steps.plan.outputs.mode == 'resume'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git checkout --detach "$VERSION"
          echo "TAG=$VERSION" >> "$GITHUB_ENV"
      # Five images, the 2.3 GB tools bundle among them: the runner's unused
      # toolchains leave too little disk for it.
      - name: Free disk space
        if: env.TAG != ''
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # The layers ci built on main come from its Actions cache: only what the
      # version changes (the engine's binary) is built again. A run on main
      # reads only caches main wrote, never a pull request's.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.TAG != ''
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
        if: env.TAG != ''
      # Build everything before anything is public.
      - name: Build the release images
        if: env.TAG != ''
        env:
          CACHE: gha-read
        run: deploy/release.sh images "$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.TAG != ''
        with:
          go-version-file: go.mod
      - name: Build the client binaries
        if: env.TAG != ''
        run: deploy/release.sh client "$TAG"
      # Fails, publishing nothing, if main moved since the plan.
      - name: Push the release commit and tag
        if: env.TAG != '' && steps.plan.outputs.mode == 'release'
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - name: Login to GHCR
        if: env.TAG != ''
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push the release images
        if: env.TAG != ''
        env:
          CACHE: gha-read
        run: deploy/release.sh images "$TAG" --push
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        if: env.TAG != ''
        with:
          version: v4.3.0 # .devcontainer/Dockerfile HELM_VERSION
      - name: Push the chart
        if: env.TAG != ''
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          deploy/release.sh chart "$TAG" --push
      # The tag's CHANGELOG section, the diff since the previous tag, and its
      # images; the release and the run's summary both show it.
      - name: Write the release notes
        if: env.TAG != ''
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          {
            echo "## Changelog"
            awk -v tag="$TAG" '/^## /{on = index($0, "## " tag " ") == 1; next} on' CHANGELOG.md
            if [ -n "$prev" ]; then
              echo
              echo "**Full diff:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...$TAG"
            fi
            echo
            echo "## Images"
            echo
            echo '```sh'
            for name in apothecaryd sandbox shim tools egress-gw; do
              echo "docker pull ghcr.io/intradeus/apothecary/$name:$TAG"
            done
            echo '```'
            echo
            echo "## Helm chart"
            echo
            echo '```sh'
            echo "helm install apothecary oci://ghcr.io/intradeus/charts/apothecary --version ${TAG#v} -f my-values.yaml"
            echo '```'
            echo
            echo "## The apothecary client"
            echo
            echo "Download the binary for your OS below, put it on your PATH as \`apothecary\`, then \`apothecary login <your engine's URL>\`. SHA256SUMS lists their checksums."
          } > "$RUNNER_TEMP/release.md"
      # Last, so a release never points at images that are not there. A
      # resumed release keeps the GitHub Release an earlier run made.
      - name: Create the GitHub Release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The GitHub Release $TAG exists; re-uploading the client binaries"
            gh release upload "$TAG" --clobber build/client/*
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release.md" build/client/*
          fi
      - name: Summary
        if: env.TAG != ''
        run: |
          {
            echo "## Released $TAG"
            echo
            cat "$RUNNER_TEMP/release.md"
          } >> "$GITHUB_STEP_SUMMARY"
