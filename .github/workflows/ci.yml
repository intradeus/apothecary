# CI: four units of checks, each a Taskfile task (task --list), on every pull
# request and every push to main. A release is cut by hand (manual-release.yml),
# only from a main commit this workflow passed: the next semver tag,
# CHANGELOG.md and the image set on GHCR. A pull request's title is checked
# by pr-title.yml.
#
#   unit         task cover              unit tests of both halves, under their
#                                        coverage floors (Go incl. Postgres, CPUI)
#   integration  task test:integration:* real dependencies, in containers
#   lint         task lint               every linter and type check
#   build        task build              every binary, the CPUI and every image
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request's run; main's runs always finish
  # (manual-release releases only a commit ci passed).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cpui/package-lock.json
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
        working-directory: cpui
      # The unit tests with their coverage floors (GO_COVER_MIN, cpui's
      # vite.config.ts thresholds): a floor only ever rises, and a change
      # that drops under one fails here, not on someone's `task cover` later.
      # The Postgres-backed tests run too (throwaway containers).
      - run: task cover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/go/index.html
            coverage/go/files.html
            cpui/coverage/
          retention-days: 14

  integration:
    strategy:
      fail-fast: false
      matrix:
        suite: [pg, docker, harness, k8s]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The tools bundle (≈2.3 GB) is built, then extracted or seeded once
      # more, beside the suites' own images; the runner's preinstalled
      # toolchains these jobs never use leave too little disk for it.
      - name: Free disk space
        if: matrix.suite != 'pg'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # k3d (pinned), and the wireguard module every run's sandbox tunnels to
      # its gateway with (k3d's nodes share the runner's kernel). The runner
      # already has docker and kubectl. The registry's name is pinned in
      # /etc/hosts (systemd-resolved answers *.localhost with loopback anyway)
      # and listed as insecure in daemon.json: dockerd speaks plain HTTP to a
      # listed registry on either image store, but to a name that merely
      # resolves to loopback only with the classic store — the containerd
      # image store, the default of a fresh Docker 29 install and what the
      # runner's dockerd now runs, trusts no name but the literal `localhost`
      # and pushes over HTTPS ("server gave HTTP response to HTTPS client").
      # The five images live three times (docker, the registry, the node's
      # containerd) and the tools bundle once more on the run's volume, which
      # is why the disk was freed above. The task creates the cluster and
      # deletes it again.
      - name: Kubernetes prerequisites
        if: matrix.suite == 'k8s'
        env:
          K3D_VERSION: v5.9.0
          K3D_REGISTRY: k3d-registry.localhost:5111 # Taskfile K3D_REGISTRY
        run: |
          curl -fsSL -o "$RUNNER_TEMP/k3d" "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          sudo install -m 0755 "$RUNNER_TEMP/k3d" /usr/local/bin/k3d
          k3d version
          sudo modprobe wireguard
          echo "127.0.0.1 ${K3D_REGISTRY%%:*}" | sudo tee -a /etc/hosts
          sudo mkdir -p /etc/docker
          [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          jq --arg r "$K3D_REGISTRY" '."insecure-registries" += [$r]' /etc/docker/daemon.json > "$RUNNER_TEMP/daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.IndexConfigs}}' | grep -q "\"$K3D_REGISTRY\""
      - run: task test:integration:${{ matrix.suite }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cpui/package-lock.json
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: npm ci
        working-directory: cpui
      - run: task lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cpui/package-lock.json
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
        working-directory: cpui
      # Five images, the tools bundle among them: see the integration job.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - run: task build
