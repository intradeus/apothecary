# CI: four units of checks, each a Taskfile task (task --list), on every pull
# request and every push to main. A release is cut by hand (manual-release.yml),
# only from a main commit this workflow passed: the next semver tag,
# CHANGELOG.md and the image set on GHCR. A pull request's title is checked
# by pr-title.yml.
#
#   unit         task cover              unit tests of both halves, under their
#                                        coverage floors (Go incl. Postgres, CPUI)
#   images       deploy/images.sh        the four images the suites below run,
#                                        built once, kept in the Actions cache
#   integration  task test:integration:* real dependencies, in containers: pg
#                                        on its own; harness and k8s load the
#                                        images job's images from the cache
#   lint         task lint               every linter and type check
#   build        task build:bin build:ui every binary and the CPUI, and the
#                                        engine image
#
# Images go between jobs through the Actions cache (10 GB per repository,
# not the account's artifact storage): a job that needs them rebuilds with
# every layer a cache hit, which is a download. On a pull request the image
# jobs run only when it touches the sandbox side (the changes job); every
# push to main runs everything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request's run; main's runs always finish
  # (manual-release releases only a commit ci passed).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cpui/package-lock.json
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
        working-directory: cpui
      # The unit tests with their coverage floors (GO_COVER_MIN, cpui's
      # vite.config.ts thresholds): a floor only ever rises, and a change
      # that drops under one fails here, not on someone's `task cover` later.
      # The Postgres-backed tests run too (throwaway containers).
      - run: task cover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/go/index.html
            coverage/go/files.html
            cpui/coverage/
          retention-days: 14

  # Whether a pull request touches what the image-based suites test: the
  # images, the adapters and kinds they exercise, the chart, the build.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sandbox: ${{ github.event_name != 'pull_request' || steps.filter.outputs.sandbox == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            sandbox:
              - 'workspace/**'
              - 'deploy/**'
              - 'charts/**'
              - 'internal/adapters/**'
              - 'internal/workspace/**'
              - 'internal/project/kinds/**'
              - 'internal/platform/**'
              - 'go.mod'
              - 'go.sum'
              - 'Taskfile.yml'
              - '.github/workflows/ci.yml'

  # The four images the harness and k8s suites run (the engine's own is the
  # build job's), built once: those suites wait for this job and load them
  # from the cache it fills, instead of each building them again.
  images:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The tools bundle (≈2.3 GB) and its build stages: the runner's
      # preinstalled toolchains these jobs never use leave too little disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3 # the cache's credentials, for buildx
      - run: deploy/images.sh local
        env:
          IMAGES: sandbox shim tools egress-gw
          PREFIX: k3d-registry.localhost:5111/apothecary # Taskfile K3D_REGISTRY
          CACHE: gha-warm # the cache is the output: nothing to load here

  integration-pg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:integration:pg

  integration:
    needs: [changes, images]
    if: needs.changes.outputs.sandbox == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [harness, k8s]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The images live twice (docker, then the node or the seeded volume).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      # The images job's images, from the cache: every layer a hit.
      - name: Load the tools image
        if: matrix.suite == 'harness'
        run: IMAGES=tools CACHE=gha-read PREFIX=apothecary deploy/images.sh "$(go run ./cmd/apothecaryd tools-hash)"
      - name: Load the images
        if: matrix.suite == 'k8s'
        run: deploy/images.sh local
        env:
          IMAGES: sandbox shim tools egress-gw
          PREFIX: k3d-registry.localhost:5111/apothecary # Taskfile K3D_REGISTRY
          CACHE: gha-read
      # k3d (pinned), and the wireguard module every run's sandbox tunnels to
      # its gateway with (k3d's nodes share the runner's kernel). The runner
      # already has docker and kubectl. The images are imported into the
      # node, so no registry setup is needed. The task creates the cluster and
      # deletes it again.
      - name: Kubernetes prerequisites
        if: matrix.suite == 'k8s'
        env:
          K3D_VERSION: v5.9.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/k3d" "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          sudo install -m 0755 "$RUNNER_TEMP/k3d" /usr/local/bin/k3d
          k3d version
          sudo modprobe wireguard
      - run: task test:integration:${{ matrix.suite }}
        env:
          APOTHECARY_IMAGES_PREBUILT: '1'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cpui/package-lock.json
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: npm ci
        working-directory: cpui
      - run: task lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cpui/package-lock.json
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
        working-directory: cpui
      - run: task build:bin build:ui
      # The engine's image; the other four are the images job's.
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - run: deploy/images.sh ci
        env:
          IMAGES: apothecaryd
          PREFIX: apothecary-build
          CACHE: gha
