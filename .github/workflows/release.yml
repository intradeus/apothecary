# CI/CD (M11 follow-up): every push to main tests, then releases —
# version-stamped image to GHCR + a matching git tag. Versions are
# monotonic: v2.0.<run_number>. Pin one in deploy/.env via
#   APOTHECARY_IMAGE=ghcr.io/intradeus/apothecary/apothecaryd:v2.0.N
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the version tag
  packages: write # push to ghcr

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/intradeus/apothecary/apothecaryd

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cpui/package-lock.json
      - name: CPUI typecheck
        working-directory: cpui
        run: |
          npm ci
          npm run check

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: v
        run: |
          echo "version=v2.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build image
        run: |
          docker build -f deploy/Dockerfile \
            --build-arg "VERSION=${{ steps.v.outputs.version }}" \
            -t "$IMAGE:${{ steps.v.outputs.version }}" \
            -t "$IMAGE:${{ steps.v.outputs.sha }}" \
            -t "$IMAGE:latest" .
          docker run --rm "$IMAGE:${{ steps.v.outputs.version }}" version
      - name: Push image
        run: |
          docker push "$IMAGE:${{ steps.v.outputs.version }}"
          docker push "$IMAGE:${{ steps.v.outputs.sha }}"
          docker push "$IMAGE:latest"
      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Check the REMOTE: the checkout is shallow and tagless, so a
          # local rev-parse never sees an existing tag and re-runs would
          # fail on the push.
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "tag exists (re-run); skipping"
          else
            git tag "${{ steps.v.outputs.version }}"
            git push origin "${{ steps.v.outputs.version }}"
          fi
