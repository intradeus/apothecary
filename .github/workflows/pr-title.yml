# A squash merge lands under the pull request's title: that title is then the
# commit the release reads (.cz.toml), so it follows the convention.
# Its own workflow so that fixing a title re-runs this check alone. The check
# is the commit-msg hook's own script (lefthook.yml), which already checked
# every commit of the branch.
name: pr-title

on:
  pull_request:
    # Not on a push: it can't change the title.
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          sh .lefthook/commit-msg/conventional.sh "$RUNNER_TEMP/title"
