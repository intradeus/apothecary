# Task runner (https://taskfile.dev) — the common dev/ops commands.
#   task --list
version: '3'

dotenv: ['deploy/.env'] # APOTHECARY_MASTER_KEY / APOTHECARY_PG_PASSWORD for dev + compose tasks

vars:
  LOCAL_COMPOSE: docker compose -p apothecary-local -f deploy/docker-compose.local.yaml
  PROD_COMPOSE: docker compose -p apothecary -f deploy/docker-compose.yaml
  DEV_PG: apothecary-dev-pg
  DEV_DSN: postgres://dev:dev@127.0.0.1:15433/dev
  # Local Kubernetes (k3d). Every kubectl/helm call names this kubeconfig:
  # these tasks never read, merge into or switch ~/.kube/config.
  K3D_CLUSTER: apothecary
  K3D_KUBECONFIG: deploy/.k3d-kubeconfig
  K3D_REGISTRY: k3d-registry.localhost:5111
  K3D_HTTP_PORT: '8090'
  K3D_KUBECTL: kubectl --kubeconfig deploy/.k3d-kubeconfig

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # --- local docker stack (builds from the working tree) ---------------------
  local:
    desc: Build the working tree and (re)start the local docker stack (UI on :8081)
    cmds:
      - '{{.LOCAL_COMPOSE}} up -d --build'
      - sleep 2
      - docker exec apothecary-local-apothecaryd-1 apothecaryd version
      - 'echo "UI: http://127.0.0.1:8081"'

  local:logs:
    desc: Follow the local stack's daemon logs
    cmds:
      - '{{.LOCAL_COMPOSE}} logs -f apothecaryd'

  local:down:
    desc: Stop the local stack + sweep engine-managed docker objects (data kept)
    cmds:
      # Compose down first (stops apothecaryd so it can't recreate anything)...
      - '{{.LOCAL_COMPOSE}} down'
      # ...then sweep the objects the ENGINE creates on the host daemon (per-run
      # DinD sandboxes, per-project egress gateways, apo-egress-* networks and
      # sandbox volumes) — compose doesn't know about them, so they'd leak.
      - task: local:sweep-managed

  # Remove every apothecary-engine-managed docker object (all carry the
  # apothecary=true label). Safe to run anytime; ignores "nothing to remove".
  local:sweep-managed:
    desc: Remove leaked engine-managed docker objects (sandboxes, gateways, nets, volumes)
    cmds:
      - docker ps -aq --filter label=apothecary=true | xargs -r docker rm -f
      - docker network ls -q --filter label=apothecary=true | xargs -r docker network rm
      - docker volume ls -q --filter label=apothecary=true | xargs -r docker volume rm -f

  local:destroy:
    desc: Stop the local stack, delete its volumes AND sweep engine-managed objects
    prompt: This wipes the local stack's database and runs dir. Continue?
    cmds:
      - '{{.LOCAL_COMPOSE}} down -v'
      - task: local:sweep-managed

  # --- local Kubernetes (k3d: k3s in docker) ----------------------------------
  # task k8s:cluster k8s:images k8s:deploy → http://apothecary.localhost:8090
  k8s:cluster:
    desc: Create the local k3d cluster and its image registry (kubeconfig in deploy/.k3d-kubeconfig)
    preconditions:
      - sh: command -v k3d
        msg: "install k3d: https://k3d.io"
    status:
      - k3d cluster get {{.K3D_CLUSTER}} >/dev/null 2>&1
    cmds:
      # The wireguard module must be loadable on the host: k3d's nodes share
      # its kernel, and every run's sandbox tunnels to its gateway with it.
      - 'lsmod | grep -q "^wireguard" || echo "note: the wireguard module is not loaded; the first gateway loads it on demand (or: sudo modprobe wireguard)"'
      - >-
        k3d cluster create {{.K3D_CLUSTER}}
        --registry-create k3d-registry.localhost:0.0.0.0:5111
        -p "{{.K3D_HTTP_PORT}}:80@loadbalancer"
        --kubeconfig-update-default=false --kubeconfig-switch-context=false
        --wait
      - k3d kubeconfig get {{.K3D_CLUSTER}} > {{.K3D_KUBECONFIG}}
      - chmod 600 {{.K3D_KUBECONFIG}}

  k8s:images:
    desc: Build the six images from the working tree and push them to the k3d registry as :local
    cmds:
      - PREFIX={{.K3D_REGISTRY}}/apothecary deploy/images.sh local --push

  k8s:deploy:
    desc: Install or upgrade the Helm chart on the k3d cluster
    preconditions:
      - sh: command -v helm
        msg: "install helm: https://helm.sh/docs/intro/install/"
      - sh: test -s {{.K3D_KUBECONFIG}}
        msg: "no cluster yet: task k8s:cluster"
    cmds:
      - test -s deploy/.k3d-master-key || (go run ./cmd/apothecaryd keygen > deploy/.k3d-master-key && chmod 600 deploy/.k3d-master-key)
      - >-
        helm upgrade --install apothecary deploy/helm/apothecary
        --kubeconfig {{.K3D_KUBECONFIG}} -n apothecary --create-namespace
        -f deploy/helm/apothecary/values-k3d.yaml
        --set masterKey="$(cat deploy/.k3d-master-key)"
        --set ingress.host=apothecary.localhost
        --set ingress.appsPort={{.K3D_HTTP_PORT}}
      # :local is rebuilt in place: restart so the engine pulls the new one.
      - '{{.K3D_KUBECTL}} -n apothecary rollout restart deploy/apothecaryd'
      - '{{.K3D_KUBECTL}} -n apothecary rollout status deploy/apothecaryd --timeout=5m'
      - 'echo "UI: http://apothecary.localhost:{{.K3D_HTTP_PORT}}"'

  k8s:logs:
    desc: Follow the engine's logs on the k3d cluster
    cmds:
      - '{{.K3D_KUBECTL}} -n apothecary logs -f deploy/apothecaryd'

  k8s:status:
    desc: List the engine and every workspace object on the k3d cluster
    cmds:
      - '{{.K3D_KUBECTL}} -n apothecary get pods'
      - '{{.K3D_KUBECTL}} -n apothecary-workspaces get pods,pvc,deploy,svc,netpol,secrets -l apothecary.io/managed=true'

  k8s:sweep:
    desc: Delete every engine-managed workspace object on the k3d cluster (the twin of local:sweep-managed)
    cmds:
      - '{{.K3D_KUBECTL}} -n apothecary-workspaces delete pods,deploy,svc,netpol,secrets,pvc -l apothecary.io/managed=true --ignore-not-found'

  k8s:kubectl:
    desc: 'kubectl against the k3d cluster: task k8s:kubectl -- get pods -A'
    cmds:
      - '{{.K3D_KUBECTL}} {{.CLI_ARGS}}'

  k8s:test-live:
    desc: Run the live Kubernetes provisioner test against the k3d cluster
    cmds:
      - >-
        APOTHECARY_LIVE_KUBECONFIG=$PWD/{{.K3D_KUBECONFIG}}
        APOTHECARY_LIVE_K8S_NAMESPACE=apothecary-live
        APOTHECARY_LIVE_IMAGE_PREFIX={{.K3D_REGISTRY}}/apothecary
        go test -tags live -count=1 -timeout 30m -run TestLiveK8s -v ./internal/adapters/workspace/

  k8s:down:
    desc: Delete the k3d cluster (its registry and everything in it)
    cmds:
      - k3d cluster delete {{.K3D_CLUSTER}}
      - rm -f {{.K3D_KUBECONFIG}}

  # --- go-run dev mode (fake kinds, no docker build) -------------------------
  dev:
    desc: Run the daemon from source with fake kinds + seeded sandbox (UI on :18080)
    deps: [dev:db]
    env:
      APOTHECARY_POSTGRES_DSN: '{{.DEV_DSN}}'
      APOTHECARY_LISTEN: 127.0.0.1:18080
      APOTHECARY_RUNS_DIR: /tmp/apothecary-dev-runs
    cmds:
      - go run ./cmd/apothecaryd serve -dev

  dev:db:
    desc: Start (or reuse) the scratch dev Postgres on :15433
    internal: true
    cmds:
      - docker start {{.DEV_PG}} 2>/dev/null ||
        docker run -d --name {{.DEV_PG}}
        -e POSTGRES_USER=dev -e POSTGRES_PASSWORD=dev -e POSTGRES_DB=dev
        -p 127.0.0.1:15433:5432 postgres:16
      - for i in $(seq 1 30); do docker exec {{.DEV_PG}} pg_isready -U dev >/dev/null 2>&1 && break; sleep 0.5; done

  dev:db:reset:
    desc: Delete the scratch dev Postgres (fresh seed on next `task dev`)
    cmds:
      - docker rm -f {{.DEV_PG}} 2>/dev/null || true

  # --- local binaries (build/, gitignored) -----------------------------------
  # For poking at binaries directly. Production never uses these: the deploy
  # image builds apothecaryd, and the engine builds the shim + gateway inside
  # docker from the go:embed'ed workspace/ sources (internal/workspace/wsimage). Always
  # build here, never in-tree: workspace/ is embedded, so a binary dropped in
  # it ships inside apothecaryd and changes the egress-gw image hash.
  build:
    desc: Build apothecaryd, the workspace shim and the egress gateway into build/
    cmds:
      - task: build:daemon
      - task: build:shim
      - task: build:gateway

  build:daemon:
    desc: Build apothecaryd into build/
    cmds:
      - go build -o build/apothecaryd ./cmd/apothecaryd

  build:shim:
    desc: Build the in-workspace shim into build/ (static, like the engine's)
    env: {CGO_ENABLED: '0'}
    cmds:
      - go build -trimpath -o build/shim ./workspace/shim

  build:gateway:
    desc: Build the egress gateway daemon into build/ (static, like the engine's)
    env: {CGO_ENABLED: '0'}
    cmds:
      - go build -trimpath -o build/gateway ./workspace/gateway

  clean:
    desc: Remove build/
    cmds:
      - rm -rf build

  # --- UI --------------------------------------------------------------------
  ui:
    desc: CPUI dev server with hot reload (proxies /api to :8080)
    dir: cpui
    cmds:
      - npm run dev

  ui:build:
    desc: Production CPUI build (cpui/build)
    dir: cpui
    cmds:
      - npm run build

  # --- API contract ----------------------------------------------------------
  # The engine's route table (internal/httpapi/routes.go) is the one place an
  # endpoint is declared. Everything else is generated from it: the OpenAPI
  # document, the Swagger UI at /docs, and the CPUI's client. Change a route,
  # run `task api`, and the compiler shows you what it touched.
  api:
    desc: Regenerate the OpenAPI document and the CPUI client from the route table
    cmds:
      - task: api:spec
      - task: api:client
      - task: api:check

  api:spec:
    desc: Write api/openapi.yaml from internal/httpapi's route table
    cmds:
      - go run ./cmd/openapigen -o api/openapi.yaml

  api:client:
    desc: Regenerate cpui/src/lib/api/generated from api/openapi.yaml
    dir: cpui
    cmds:
      - npx --yes @hey-api/openapi-ts
      - npx prettier --write src/lib/api/generated

  api:check:
    desc: 'Fail if the spec is stale or the generated client leaked past the ACL'
    cmds:
      - go run ./cmd/openapigen -check
      - node cpui/scripts/check-api-boundary.mjs

  api:docs:
    desc: Open the Swagger UI of a running engine (task local / task dev first)
    cmds:
      - 'echo "Swagger UI: {{.API_URL}}/docs   ·   document: {{.API_URL}}/api/openapi.json"'
      - '(xdg-open {{.API_URL}}/docs >/dev/null 2>&1 &) || true'
    vars:
      API_URL: '{{.API_URL | default "http://127.0.0.1:8080"}}'

  api:swagger-ui:
    desc: Refresh the vendored Swagger UI assets (internal/httpapi/swaggerui)
    dir: internal/httpapi/swaggerui
    cmds:
      - npm pack swagger-ui-dist --silent
      - tar xzf swagger-ui-dist-*.tgz
      - mv package/swagger-ui-bundle.js package/swagger-ui.css package/LICENSE .
      - rm -rf package swagger-ui-dist-*.tgz
      - echo "vendored $(du -sh . | cut -f1) of Swagger UI"

  # --- testing & verification ------------------------------------------------
  test:
    desc: 'Go tests (args pass through: task test -- ./internal/engine/ -run TestX -v)'
    cmds:
      - go test {{.CLI_ARGS | default "./..."}}

  check:
    desc: svelte-check (CPUI types)
    dir: cpui
    cmds:
      - npm run check

  fmt:
    desc: gofmt the Go tree, prettier the frontend
    cmds:
      - gofmt -w ./cmd ./internal ./workspace 2>/dev/null || gofmt -w .
      - cd cpui && npm run format

  test:omp-broker:
    desc: 'Run the pinned omp (from the tools image) against the engine''s auth broker face — omp''s wire schemas are strict'
    cmds:
      - |
        dir="$(mktemp -d)"; trap 'rm -rf "$dir"; docker rm -f apo-omp-conformance >/dev/null 2>&1' EXIT
        docker create --name apo-omp-conformance apothecary/tools:dev >/dev/null
        docker cp apo-omp-conformance:/tools/gnu/. "$dir/gnu" >/dev/null
        OMP_BIN="$dir/gnu/bin/omp" go test -tags ompconformance -count=1 -run TestOmpConformance -v ./internal/kinds/

  lint:models:
    desc: 'Fail on a real model id anywhere in the tree — models live in a project’s flow binding, never in code, flows, tests or docs (a wire fingerprint that must name one carries `lint:models-ok`)'
    cmds:
      - |
        hits="$(grep -rnE --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.svelte-kit --exclude-dir=build --exclude-dir=generated --exclude-dir=UX --exclude=IMPLEMENTATION_NOTES.md --exclude=TODO.md 'glm-[0-9]|gpt-[0-9]|claude-(sonnet|opus|haiku|[0-9])|qwen[0-9]|kimi-k[0-9]|gemini-[0-9]' cmd internal cpui/src docs examples workspace api README.md 2>/dev/null | grep -v 'lint:models-ok' || true)"
        if [ -n "$hits" ]; then echo "$hits"; echo "a model id in the tree rots when the vendor renames it — bind models per project (Workshop → Flows → Configure); tests use fake/… or acme/… ids"; exit 1; fi

  verify:
    desc: 'The full pre-commit gate: gofmt, vet, go tests, model-id lint, API contract, svelte-check, UI build'
    cmds:
      - |
        out="$(gofmt -l ./cmd ./internal)"
        if [ -n "$out" ]; then echo "$out"; echo "gofmt needed — run task fmt"; exit 1; fi
      - go vet ./...
      - go test ./...
      - task: lint:models
      - task: api:check
      - cd cpui && npm run check
      - cd cpui && npm run build
      - echo "verify — all green"

  # --- production stack (published image) ------------------------------------
  prod:upgrade:
    desc: Pull the latest release and restart the production stack
    cmds:
      - '{{.PROD_COMPOSE}} pull apothecaryd'
      - '{{.PROD_COMPOSE}} up -d'
      - sleep 2
      - docker exec apothecary-apothecaryd-1 apothecaryd version

  prod:logs:
    desc: Follow the production daemon logs
    cmds:
      - '{{.PROD_COMPOSE}} logs -f apothecaryd'

  # --- misc ------------------------------------------------------------------
  keygen:
    desc: Print a fresh APOTHECARY_MASTER_KEY
    cmds:
      - go run ./cmd/apothecaryd keygen

  validate:
    desc: 'Validate a flow file: task validate -- path/to/flow.yaml'
    cmds:
      - go run ./cmd/apothecaryd validate {{.CLI_ARGS}}
