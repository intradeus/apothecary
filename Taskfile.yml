# Task runner (https://taskfile.dev) — the common dev/ops commands.
#   task --list
version: '3'

dotenv: ['deploy/.env'] # APOTHECARY_MASTER_KEY for the dev tasks

vars:
  DEV_PG: apothecary-dev-pg
  # The dev tasks' Postgres. APOTHECARY_DEV_DSN overrides it — the repo's
  # devcontainer sets it to its `db` sibling, and dev:db is then skipped.
  DEV_DSN: '{{.APOTHECARY_DEV_DSN | default "postgres://dev:dev@127.0.0.1:15433/dev"}}'
  # A floor, not a target: raise it when coverage rises, never lower it.
  GO_COVER_MIN: 95
  # Local Kubernetes (k3d). Every kubectl/helm call names this kubeconfig:
  # these tasks never read, merge into or switch ~/.kube/config.
  K3D_CLUSTER: apothecary
  K3D_KUBECONFIG: deploy/.k3d-kubeconfig
  K3D_REGISTRY: k3d-registry.localhost:5111
  K3D_HTTP_PORT: '8090'
  K3D_KUBECTL: kubectl --kubeconfig deploy/.k3d-kubeconfig

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # --- local Kubernetes (k3d: k3s in docker) ----------------------------------
  # task k8s:cluster k8s:images k8s:deploy → http://apothecary.localhost:8090
  # Idempotent: creates the cluster if it is missing, starts it if it is
  # stopped, and (re)writes its kubeconfig; up to date once the API answers.
  k8s:cluster:
    desc: Create (or start) the local k3d cluster and its image registry (kubeconfig in deploy/.k3d-kubeconfig)
    preconditions:
      - sh: command -v k3d
        msg: "install k3d: https://k3d.io"
      # k3d's nodes share the docker host's kernel (on macOS, the docker VM's),
      # and every run's sandbox tunnels to its gateway over WireGuard: create
      # a wireguard link the way the gateway does, in a throwaway netns. On
      # Linux that also loads the module on demand.
      - sh: docker run --rm --cap-add NET_ADMIN --network none alpine:3.21 sh -c 'ip link add apo-wgprobe type wireguard && ip link del apo-wgprobe'
        msg: "the docker host's kernel can't create wireguard links (Linux: sudo modprobe wireguard)"
    status:
      - test -s {{.K3D_KUBECONFIG}}
      - '{{.K3D_KUBECTL}} get --raw /readyz >/dev/null 2>&1'
    cmds:
      # The server node, not `k3d cluster get`: right after a delete, that
      # can still report the cluster (seen with k3d 5.9.0).
      - >-
        k3d node get k3d-{{.K3D_CLUSTER}}-server-0 >/dev/null 2>&1 ||
        k3d cluster create {{.K3D_CLUSTER}}
        --registry-create k3d-registry.localhost:0.0.0.0:5111
        -p "{{.K3D_HTTP_PORT}}:80@loadbalancer"
        --kubeconfig-update-default=false --kubeconfig-switch-context=false
        --wait
      - k3d cluster start {{.K3D_CLUSTER}} --wait
      - k3d kubeconfig get {{.K3D_CLUSTER}} > {{.K3D_KUBECONFIG}}
      - chmod 600 {{.K3D_KUBECONFIG}}

  # The API server answers /readyz, waiting up to 3 minutes: a k3s server can
  # restart under memory pressure long after `cluster create --wait`.
  k8s:ready:
    internal: true
    cmds:
      - |
        for _ in $(seq 90); do
          {{.K3D_KUBECTL}} get --raw /readyz >/dev/null 2>&1 && exit 0
          sleep 2
        done
        echo "the k3d API server is not ready after 3 minutes" >&2
        {{.K3D_KUBECTL}} get --raw '/readyz?verbose' >&2 || true
        docker logs --tail 50 k3d-{{.K3D_CLUSTER}}-server-0 >&2 || true
        exit 1

  # dockerd speaks plain HTTP to a registry listed as insecure in daemon.json
  # on either image store, but to a name that merely resolves to loopback (as
  # k3d-registry.localhost does) only with the classic store: the containerd
  # image store, the default of a fresh Docker 29 install, trusts no name but
  # the literal `localhost`, and the push fails with "server gave HTTP
  # response to HTTPS client". Checked before the build, which runs for
  # minutes.
  k8s:registry-check:
    internal: true
    silent: true
    cmds:
      - |
        docker info --format '{{"{{"}}json .RegistryConfig.IndexConfigs{{"}}"}}' | grep -q '"{{.K3D_REGISTRY}}"' && exit 0
        docker info --format '{{"{{"}}.DriverStatus{{"}}"}}' | grep -q io.containerd.snapshotter || exit 0
        echo 'the docker daemon uses the containerd image store and would push to {{.K3D_REGISTRY}} over HTTPS;' >&2
        echo 'list it in /etc/docker/daemon.json and restart docker: {"insecure-registries": ["{{.K3D_REGISTRY}}"]}' >&2
        exit 1

  k8s:images:
    desc: Build the five images from the working tree and push them to the k3d registry as :local
    cmds:
      - task: k8s:registry-check
      - PREFIX={{.K3D_REGISTRY}}/apothecary deploy/images.sh local --push

  k8s:deploy:
    desc: Install or upgrade the Helm chart on the k3d cluster
    preconditions:
      - sh: command -v helm
        msg: "install helm: https://helm.sh/docs/intro/install/"
      - sh: test -s {{.K3D_KUBECONFIG}}
        msg: "no cluster yet: task k8s:cluster"
    cmds:
      - test -s deploy/.k3d-master-key || (go run ./cmd/apothecaryd keygen > deploy/.k3d-master-key && chmod 600 deploy/.k3d-master-key)
      - >-
        helm upgrade --install apothecary charts/apothecary
        --kubeconfig {{.K3D_KUBECONFIG}} -n apothecary --create-namespace
        -f charts/apothecary/ci/k3d-values.yaml
        --set masterKey="$(cat deploy/.k3d-master-key)"
        --set access.http.port={{.K3D_HTTP_PORT}}
      # :local is rebuilt in place: restart so the engine pulls the new one.
      - '{{.K3D_KUBECTL}} -n apothecary rollout restart deploy/apothecaryd'
      - '{{.K3D_KUBECTL}} -n apothecary rollout status deploy/apothecaryd --timeout=5m'
      - 'echo "UI: http://apothecary.localhost:{{.K3D_HTTP_PORT}}"'

  k8s:logs:
    desc: Follow the engine's logs on the k3d cluster
    cmds:
      - '{{.K3D_KUBECTL}} -n apothecary logs -f deploy/apothecaryd'

  k8s:status:
    desc: List the engine and every workspace object on the k3d cluster
    cmds:
      - '{{.K3D_KUBECTL}} -n apothecary get pods'
      - '{{.K3D_KUBECTL}} -n apothecary-workspaces get pods,pvc,deploy,svc,netpol,secrets -l apothecary.io/managed=true'

  k8s:sweep:
    desc: Delete every engine-managed workspace object on the k3d cluster
    cmds:
      - '{{.K3D_KUBECTL}} -n apothecary-workspaces delete pods,deploy,svc,netpol,secrets,pvc -l apothecary.io/managed=true --ignore-not-found'

  k8s:kubectl:
    desc: 'kubectl against the k3d cluster: task k8s:kubectl -- get pods -A'
    cmds:
      - '{{.K3D_KUBECTL}} {{.CLI_ARGS}}'

  k8s:test-live:
    desc: Run the live Kubernetes tests (the provisioner, the project browser) against the k3d cluster
    cmds:
      - task: k8s:ready
      - >-
        APOTHECARY_LIVE_KUBECONFIG=$PWD/{{.K3D_KUBECONFIG}}
        APOTHECARY_LIVE_K8S_NAMESPACE=apothecary-live
        APOTHECARY_LIVE_IMAGE_PREFIX={{.K3D_REGISTRY}}/apothecary
        go test -tags live -count=1 -timeout 30m -run TestLiveK8s -v ./internal/adapters/workspace/ ./internal/adapters/browser/

  k8s:down:
    desc: Delete the k3d cluster (its registry and everything in it)
    cmds:
      - k3d cluster delete {{.K3D_CLUSTER}}
      - rm -f {{.K3D_KUBECONFIG}}

  # --- go-run dev mode (fake kinds, no docker build) -------------------------
  dev:
    desc: 'Run the daemon from source with fake kinds + seeded sandbox: the API on :18080 (task ui for the UI; task dev:up for both)'
    deps: [dev:db]
    env:
      APOTHECARY_POSTGRES_DSN: '{{.DEV_DSN}}'
      APOTHECARY_LISTEN: 127.0.0.1:18080
      APOTHECARY_RUNS_DIR: /tmp/apothecary-dev-runs
    cmds:
      - go run ./cmd/apothecaryd serve -dev

  dev:db:
    desc: Start (or reuse) the scratch dev Postgres on :15433
    internal: true
    status:
      # A Postgres was provided (the devcontainer's db): nothing to start.
      - test -n "$APOTHECARY_DEV_DSN"
    cmds:
      - docker start {{.DEV_PG}} 2>/dev/null ||
        docker run -d --name {{.DEV_PG}}
        -e POSTGRES_USER=dev -e POSTGRES_PASSWORD=dev -e POSTGRES_DB=dev
        -p 127.0.0.1:15433:5432 postgres:16
      - for i in $(seq 1 30); do docker exec {{.DEV_PG}} pg_isready -U dev >/dev/null 2>&1 && break; sleep 0.5; done

  dev:db:reset:
    desc: Delete the scratch dev Postgres (fresh seed on next `task dev`)
    cmds:
      - docker rm -f {{.DEV_PG}} 2>/dev/null || true

  dev:app:
    desc: 'Build the CPUI, then run the daemon from source serving API + UI on :18080 (fake kinds) — what the apothecary project service runs (task dev:up)'
    deps: [dev:db]
    preconditions:
      - sh: test -n "$APOTHECARY_MASTER_KEY"
        msg: 'APOTHECARY_MASTER_KEY is unset: `task dev:key` writes one into deploy/.env'
    env:
      APOTHECARY_POSTGRES_DSN: '{{.DEV_DSN}}'
      APOTHECARY_LISTEN: 127.0.0.1:18080
      APOTHECARY_RUNS_DIR: /tmp/apothecary-dev-runs
      APOTHECARY_CPUI_DIR: '{{.ROOT_DIR}}/cpui/build'
    cmds:
      - task: build:ui
      - go run ./cmd/apothecaryd serve -dev

  dev:key:
    desc: 'Write a fresh APOTHECARY_MASTER_KEY into deploy/.env (gitignored) when it has none'
    status:
      - grep -qs '^APOTHECARY_MASTER_KEY=' deploy/.env
    cmds:
      - echo "APOTHECARY_MASTER_KEY=$(go run ./cmd/apothecaryd keygen)" >> deploy/.env

  dev:up:
    desc: 'dev:key, then dev:app in a fresh task process (the dotenv is read at start, so the key just written is seen): the one-liner the apothecary project service starts'
    cmds:
      - task: dev:key
      - '{{.TASK_EXE}} dev:app'

  # --- build: everything a release ships, built from the working tree ---------
  # `task build` is CI's build job: the binaries, the CPUI and every image. The
  # binaries land in build/ (gitignored), for poking at them directly.
  # Production never uses these: the release images are built by
  # deploy/images.sh. Always build here, never in-tree: workspace/ is
  # embedded, so a binary dropped in it ships inside apothecaryd and changes
  # the shim and egress-gw image hashes.
  build:
    desc: 'Build everything: apothecaryd, the shim and gateway, the CPUI, and the five images (needs docker)'
    cmds:
      - task: build:bin
      - task: build:ui
      - task: build:images

  build:bin:
    desc: Build apothecaryd, the apothecary client, the workspace shim and the egress gateway into build/
    cmds:
      - task: build:daemon
      - task: build:client
      - task: build:shim
      - task: build:gateway

  build:daemon:
    desc: Build apothecaryd into build/
    cmds:
      - go build -o build/apothecaryd ./cmd/apothecaryd

  build:client:
    desc: Build the apothecary terminal client into build/ (this machine's OS)
    cmds:
      - go build -o build/apothecary ./cmd/apothecary

  # The released client binaries, one per OS and architecture people run it on.
  build:client:release:
    desc: 'Cross-build the apothecary client for Linux, macOS and Windows into build/client/ (VERSION=vX.Y.Z)'
    cmds:
      - deploy/release.sh client {{.VERSION | default "dev"}}

  # The shim and the gateway only ever run in Linux containers.
  build:shim:
    desc: Build the in-workspace shim into build/ (static linux, like the engine's)
    env: {CGO_ENABLED: '0', GOOS: linux}
    cmds:
      - go build -trimpath -o build/shim ./workspace/shim

  build:gateway:
    desc: Build the egress gateway daemon into build/ (static linux, like the engine's)
    env: {CGO_ENABLED: '0', GOOS: linux}
    cmds:
      - go build -trimpath -o build/gateway ./workspace/gateway

  build:ui:
    desc: Production CPUI build (cpui/build)
    dir: cpui
    cmds:
      - npm run build

  build:images:
    desc: 'Build the five release images from the working tree, tagged apothecary-build/<name>:ci, without pushing (needs docker)'
    env: {PREFIX: apothecary-build}
    cmds:
      - deploy/images.sh ci

  clean:
    desc: Remove build/
    cmds:
      - rm -rf build

  # --- UI --------------------------------------------------------------------
  ui:
    desc: CPUI dev server with hot reload (proxies /api to :8080)
    dir: cpui
    cmds:
      - npm run dev

  # --- API contract ----------------------------------------------------------
  # The engine's route table (internal/httpapi/routes.go) is the one place an
  # endpoint is declared. Everything else is generated from it: the OpenAPI
  # document, the Swagger UI at /docs, and the CPUI's client. Change a route,
  # run `task api`, and the compiler shows you what it touched.
  api:
    desc: Regenerate the OpenAPI document and the CPUI client from the route table
    cmds:
      - task: api:spec
      - task: api:client
      - task: api:check

  api:spec:
    desc: Write api/openapi.yaml from internal/httpapi's route table
    cmds:
      - go run ./cmd/openapigen -o api/openapi.yaml

  api:client:
    desc: Regenerate cpui/src/lib/api/generated from api/openapi.yaml
    dir: cpui
    cmds:
      - npx --yes @hey-api/openapi-ts
      - npx prettier --write src/lib/api/generated

  api:check:
    desc: 'Fail if the spec is stale or the generated client leaked past the ACL'
    cmds:
      - go run ./cmd/openapigen -check
      - node cpui/scripts/check-api-boundary.mjs

  api:docs:
    desc: Open the Swagger UI of a running engine (task dev or task dev:up first)
    cmds:
      - 'echo "Swagger UI: {{.API_URL}}/docs   ·   document: {{.API_URL}}/api/openapi.json"'
      - '(xdg-open {{.API_URL}}/docs >/dev/null 2>&1 &) || true'
    vars:
      API_URL: '{{.API_URL | default "http://127.0.0.1:8080"}}'

  api:swagger-ui:
    desc: Refresh the vendored Swagger UI assets (internal/httpapi/swaggerui)
    dir: internal/httpapi/swaggerui
    cmds:
      - npm pack swagger-ui-dist --silent
      - tar xzf swagger-ui-dist-*.tgz
      - mv package/swagger-ui-bundle.js package/swagger-ui.css package/LICENSE .
      - rm -rf package swagger-ui-dist-*.tgz
      - echo "vendored $(du -sh . | cut -f1) of Swagger UI"

  # --- tests, lint ------------------------------------------------------------
  # Four units, each its own CI job (.github/workflows/ci.yml):
  #   test:unit         nothing running, any OS: Go unit + scenario suites and
  #                     the CPUI's tests (CI runs them on Linux)
  #   test:integration  real dependencies, always in containers: Postgres and
  #                     boot, docker workspaces and the browser, the harness
  #                     binaries, Kubernetes (k3d)
  #   lint              every linter and type check
  #   build             every binary, the CPUI and every image (above)
  # The fan-out tasks don't forward arguments: the suites take different ones
  # (go test flags, vitest filters, test-binary flags). Pass them to the one
  # suite they belong to — except test:unit, whose arguments are the Go tests'
  # (`task test:unit -- -count=1 ./...`), the UI half running whole. An
  # override only reaches the task called (CLI_ARGS is re-read below it), so
  # each fan-out names its leaves.
  test:
    desc: 'Unit then integration tests (no args: pass them to one suite)'
    cmds:
      - task: test:unit:go
        vars: {CLI_ARGS: ''}
      - task: test:unit:ui
        vars: {CLI_ARGS: ''}
      - task: test:integration
        vars: {CLI_ARGS: ''}

  test:unit:
    desc: 'Unit tests, nothing running: Go (`go test ./...`) and the CPUI (vitest); args go to go test (task test:unit -- -count=1 ./...)'
    cmds:
      - task: test:unit:go
      - task: test:unit:ui
        vars: {CLI_ARGS: ''}

  test:unit:go:
    desc: 'Go unit + scenario suites (args pass through: task test:unit:go -- ./internal/engine/ -run TestX -v)'
    env:
      TEST_POSTGRES: ''
    cmds:
      - go test {{.CLI_ARGS | default "./..."}}

  test:unit:ui:
    desc: 'CPUI tests (args pass through: task test:unit:ui -- src/lib/run)'
    dir: cpui
    cmds:
      - npx vitest run {{.CLI_ARGS}}

  # A flake hides until a loaded CI runner finds it; this is that runner,
  # locally: the tests pinned to two CPUs shared with six busy loops, repeated,
  # under the race detector. What fails here fails on CI sooner or later.
  # Linux only (taskset); the whole tree takes about an hour.
  test:stress:
    desc: 'Go tests under CI-like load: 2 CPUs + burners, -race, repeated (task test:stress -- ./internal/engine/; COUNT=5 task test:stress)'
    vars:
      COUNT: '{{.COUNT | default "3"}}'
    preconditions:
      - sh: command -v taskset
        msg: "test:stress needs taskset (Linux, util-linux)"
    env:
      TEST_POSTGRES: ''
      GOMAXPROCS: '2'
    cmds:
      # The burners carry a marker in their argv (sh's $0) for pkill: Task's
      # shell has no $! to kill them by, and a timeout bounds a stray one.
      # `|| rc=$?`: Task runs this under set -e, and a failing go test must
      # still reach the pkill.
      - |
        for _ in 1 2 3 4 5 6; do timeout 2h taskset -c 0,1 sh -c 'while :; do :; done' apothecary-test-stress-burner & done
        rc=0
        taskset -c 0,1 go test -race -count={{.COUNT}} -timeout 30m {{.CLI_ARGS | default "./..."}} || rc=$?
        pkill -f apothecary-test-stress-burner
        exit $rc

  test:linux:
    desc: 'Go unit tests inside a Linux container, so the Linux-only build-tagged tests run from any host; needs docker (args pass through)'
    cmds:
      # --init: Go as PID 1 doesn't reap children, breaking the process-group tests.
      # --tmpfs /tmp:exec: overlay /tmp reports empty directory sizes as 0.
      - >-
        docker run --rm --init --tmpfs /tmp:exec
        -v "{{.ROOT_DIR}}":/src:ro -w /src
        -v apothecary-gomod:/go/pkg/mod -v apothecary-gocache:/root/.cache/go-build
        -e TEST_POSTGRES=''
        golang:1.26.4
        go test -count=1 {{.CLI_ARGS | default "./..."}}

  test:integration:
    desc: 'Every integration suite: Postgres + boot, the harness binaries, Kubernetes (needs docker; no args: pass them to one suite)'
    cmds:
      - task: test:integration:pg
        vars: {CLI_ARGS: ''}
      - task: test:integration:harness
        vars: {CLI_ARGS: ''}
      - task: test:integration:k8s
        vars: {CLI_ARGS: ''}

  # Each test binary starts its own throwaway Postgres container
  # (internal/adapters/pgstore/pgtest) and gives each test its own database. A
  # test skips when TEST_POSTGRES is empty; these are the packages using pgtest.
  test:integration:pg:
    desc: 'The Postgres adapter and boot tests, on real throwaway containers (needs docker; args pass through)'
    env:
      TEST_POSTGRES: '1'
    vars:
      PG_PACKAGES:
        sh: grep -rlE --include='*_test.go' 'pgstore/pgtest"|^package pgtest' cmd internal | xargs -n1 dirname | sort -u | sed 's|^|./|' | tr '\n' ' '
    cmds:
      - task: pg:warm
      # -count=1: Go's test cache can't see the server, so a cached pass would
      # prove nothing.
      - go test -count=1 {{.CLI_ARGS | default .PG_PACKAGES}}

  # One pgtest test on its own first: it pulls postgres and testcontainers'
  # reaper image and starts a reaper. Test binaries run in parallel, and on a
  # cold docker (a fresh CI runner) they would all race to pull and to create
  # the one reaper container their session shares; the losers outlast
  # testcontainers' 20s retry and fail on the name conflict.
  pg:warm:
    internal: true
    env:
      TEST_POSTGRES: '1'
    cmds:
      - go test -count=1 -run '^TestEmptyDatabasesAreSeparate$' ./internal/adapters/pgstore/pgtest/

  # The pinned harness binaries against what the engine hands them: config and
  # auth files, provider.env, the ACP face, omp's broker. Only the harness can
  # say it accepts them (internal/project/kinds/conformance_test.go). The
  # bundle is the one this engine expects — apothecary/tools:<ToolsHash>, built
  # here from workspace/images/tools when missing — seeded into a volume by its
  # own seed.sh (as a Kubernetes sandbox's init container does; a no-op when
  # the volume holds this hash) and mounted where every workspace mounts it.
  # Its binaries are Linux ones, so the tests run in a Linux container.
  test:integration:harness:
    desc: 'The pinned harness CLIs of the tools bundle against what the engine generates (needs docker; args are go test flags, e.g. -- -run TestCodexConformance)'
    vars:
      TOOLS_HASH:
        sh: go run ./cmd/apothecaryd tools-hash
    cmds:
      - >-
        docker image inspect apothecary/tools:{{.TOOLS_HASH}} >/dev/null 2>&1 ||
        docker build -t apothecary/tools:{{.TOOLS_HASH}} --build-arg TOOLS_HASH={{.TOOLS_HASH}} workspace/images/tools
      - docker run --rm -v apothecary-harness-tools:/seed apothecary/tools:{{.TOOLS_HASH}} /seed/tools
      # --init and --tmpfs /tmp:exec: as test:linux.
      - >-
        docker run --rm --init --tmpfs /tmp:exec
        -v "{{.ROOT_DIR}}":/src:ro -w /src
        -v apothecary-gomod:/go/pkg/mod -v apothecary-gocache:/root/.cache/go-build
        -v apothecary-harness-tools:/opt/apothecary:ro
        -e TEST_POSTGRES=''
        golang:1.26.4
        go test -tags conformance -count=1 -timeout 20m -v -run Conformance {{.CLI_ARGS}} ./internal/project/kinds/

  # Reuses the cluster if it exists (and leaves it, with the :local images
  # pushed to its registry); otherwise creates it and deletes it afterwards,
  # registry included — pass or fail. The images are built before the cluster
  # starts: building the tools bundle beside a running k3s starves a CI
  # runner, and its API server drops out ("apiserver not ready") under the
  # tests. k8s:images then only pushes, from the build cache.
  test:integration:k8s:
    desc: 'The Kubernetes provisioner and project browser on a local k3d cluster: cluster, images, live tests (needs docker, k3d)'
    vars:
      CLUSTER_EXISTED:
        sh: k3d node get k3d-{{.K3D_CLUSTER}}-server-0 >/dev/null 2>&1 && echo yes || echo no
    cmds:
      - task: k8s:registry-check
      - PREFIX={{.K3D_REGISTRY}}/apothecary deploy/images.sh local
      - task: k8s:cluster
      - defer: '{{if eq .CLUSTER_EXISTED "no"}}{{.TASK_EXE}} k8s:down{{end}}'
      - task: k8s:images
      - task: k8s:test-live

  cover:
    desc: 'Test coverage of both halves, as pages: coverage/go/index.html and cpui/coverage/index.html'
    cmds:
      - task: cover:go
      - cd cpui && npm run test:coverage
      - 'echo "Backend:  coverage/go/index.html"'
      - 'echo "Frontend: cpui/coverage/index.html"'

  cover:go:
    desc: 'Backend coverage: every package counted, Postgres tests included; fails under GO_COVER_MIN'
    env:
      TEST_POSTGRES: '1'
      # Tests that run the real shim as a subprocess build it to report here.
      APOTHECARY_COVERDIR: '{{.ROOT_DIR}}/coverage/go/subprocess'
    cmds:
      - task: pg:warm
      - rm -rf coverage/go/subprocess && mkdir -p coverage/go/subprocess
      # -count=1: a cached package runs no subprocess, so its shim coverage would vanish.
      - go test -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage/go/profile.out ./...
      - go tool covdata textfmt -i=coverage/go/subprocess -o coverage/go/subprocess.out
      - tail -n +2 coverage/go/subprocess.out >> coverage/go/profile.out
      - go tool cover -html=coverage/go/profile.out -o coverage/go/files.html
      - go run ./cmd/coverreport -profile coverage/go/profile.out -out coverage/go/index.html -min {{.GO_COVER_MIN}}

  lint:
    desc: 'Every linter and type check: gofmt, go vet (both OSes, every build tag), model ids, the API contract, svelte-check, the CPUI linters, the Helm chart'
    cmds:
      - task: lint:go
      - task: lint:models
      - task: api:check
      - task: lint:ui
      - task: lint:helm

  lint:go:
    desc: 'gofmt, and go vet for linux and darwin with every build tag, so no file goes unchecked'
    cmds:
      - |
        out="$(gofmt -l ./cmd ./internal ./workspace)"
        if [ -n "$out" ]; then echo "$out"; echo "gofmt needed — run task fmt"; exit 1; fi
      - for: [linux, darwin]
        cmd: GOOS={{.ITEM}} CGO_ENABLED=0 go vet ./...
      - CGO_ENABLED=0 GOOS=linux go vet -tags live,conformance,coverflush ./...

  lint:ui:
    desc: 'CPUI: svelte-check, then every lint — code, styles, the token and layer contracts, tests beside sources, themes, formatting (docs/frontend-standards.md)'
    dir: cpui
    cmds:
      - npm run check
      - npm run lint

  # Every example values file lints and renders, the schema refuses what it
  # must, and the chart's README is what helm-docs makes of values.yaml.
  lint:helm:
    desc: 'helm lint + template the chart with its defaults and every ci/*-values.yaml; the schema refuses bad values; the README is current'
    preconditions:
      - sh: command -v helm
        msg: 'install helm: https://helm.sh/docs/intro/install/'
    vars:
      CHART: charts/apothecary
      HELM_DOCS: go run github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2
      VALUES:
        sh: ls charts/apothecary/ci/*-values.yaml
    cmds:
      - helm lint {{.CHART}} --set masterKey=lint --set postgres.password=lint
      - helm template lint {{.CHART}} --set masterKey=lint --set postgres.password=lint >/dev/null
      - for: { var: VALUES }
        cmd: helm lint {{.CHART}} -f {{.ITEM}} && helm template lint {{.CHART}} -f {{.ITEM}} >/dev/null
      - for: [workspaces.runtimeClassName=, access.http.ingress.enabled=true, access.http.appsDomain=apps.example.com, ssh.enabled=true, engine.replicas=2]
        cmd: '! helm template lint {{.CHART}} --set masterKey=lint --set postgres.password=lint --set {{.ITEM}} >/dev/null 2>&1 || { echo "the schema must refuse {{.ITEM}}"; exit 1; }'
      - '{{.HELM_DOCS}} -c charts -s file --skip-version-footer -l warning -d | diff -u {{.CHART}}/README.md - || { echo "charts/apothecary/README.md is stale: run task chart:docs"; exit 1; }'

  chart:docs:
    desc: Regenerate charts/apothecary/README.md from values.yaml (helm-docs)
    cmds:
      - go run github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2 -c charts -s file --skip-version-footer -l warning

  fmt:
    desc: gofmt the Go tree, prettier the frontend
    cmds:
      - gofmt -w ./cmd ./internal ./workspace 2>/dev/null || gofmt -w .
      - cd cpui && npm run format

  lint:models:
    desc: 'Fail on a real model id anywhere in the tree — models live in a project’s flow binding, never in code, flows, tests or docs (a wire fingerprint that must name one carries `lint:models-ok`)'
    cmds:
      - |
        hits="$(grep -rnE --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.svelte-kit --exclude-dir=build --exclude-dir=generated --exclude-dir=UX --exclude=IMPLEMENTATION_NOTES.md --exclude=TODO.md 'glm-[0-9]|gpt-[0-9]|claude-(sonnet|opus|haiku|[0-9])|qwen[0-9]|kimi-k[0-9]|gemini-[0-9]' cmd internal cpui/src docs examples workspace api README.md AGENTS.md 2>/dev/null | grep -v 'lint:models-ok' || true)"
        if [ -n "$hits" ]; then echo "$hits"; echo "a model id in the tree rots when the vendor renames it — bind models per project (Workshop → Flows → Configure); tests use fake/… or acme/… ids"; exit 1; fi

  verify:
    desc: 'The pre-commit gate: every lint, the unit tests with coverage (Postgres included), the binaries and the CPUI build'
    cmds:
      - task: lint
      - task: cover:go
      - cd cpui && npm run test:coverage
      - task: build:bin
      - task: build:ui
      - echo "verify — all green"

  # --- commits & releases ----------------------------------------------------
  # Commits follow .cz.toml; lefthook.yml's commit-msg hook checks each one
  # (registered by `npm ci` in cpui), and manual-release, run by hand on a
  # green main, cuts the next semver tag (.github/workflows).
  commit:
    desc: 'Write a conventional commit interactively (cz commit: type, scope, ! for breaking; needs commitizen)'
    interactive: true
    preconditions:
      - sh: command -v cz
        msg: 'install commitizen: brew install commitizen (or pipx install commitizen)'
    cmds:
      - cz commit

  release:preview:
    desc: 'The version and changelog section the next release of HEAD would get (dry run; needs commitizen)'
    preconditions:
      - sh: command -v cz
        msg: 'install commitizen: brew install commitizen (or pipx install commitizen)'
    cmds:
      - deploy/release.sh preview

  # --- misc ------------------------------------------------------------------
  keygen:
    desc: Print a fresh APOTHECARY_MASTER_KEY
    cmds:
      - go run ./cmd/apothecaryd keygen

  validate:
    desc: 'Validate a flow file: task validate -- path/to/flow.yaml'
    cmds:
      - go run ./cmd/apothecaryd validate {{.CLI_ARGS}}
