<!doctype html>
<html lang="en" data-theme="ember-sky">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Apothecary</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400..700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
		/>
		<script>
			// Apply the saved theme before first paint so a Light user never sees a
			// dark flash. prefs.svelte.ts owns the key after boot.
			try {
				// ?theme=<id> overrides (handy for screenshots and support).
				var t =
					new URLSearchParams(location.search).get('theme') ||
					localStorage.getItem('apothecary.theme.v2');
				// Any id is applied as-is; prefs ($lib/themes) validates it on
				// boot, and an unknown one falls back to the :root default.
				if (t && /^[a-z0-9-]+$/.test(t)) document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
