# EKS, reachable from the internet: the UI behind its sign-in, apps behind
# their owner's, every port and SSH through the authenticated tunnel.
# Needs the AWS Load Balancer Controller and the EBS CSI driver; sandbox
# nodes are a node group with sysbox installed (sysbox-deploy-k8s), whose
# RuntimeClass places sandbox pods there.
#
#   kubectl -n apothecary create secret generic apothecaryd-env \
#     --from-literal=APOTHECARY_MASTER_KEY="$(apothecaryd keygen)" \
#     --from-literal=APOTHECARY_POSTGRES_DSN=postgres://…@<rds>:5432/apothecary
existingSecret: apothecaryd-env
postgres:
  enabled: false           # RDS; the DSN is in existingSecret

engine:
  runsDir:
    storageClass: gp3      # WaitForFirstConsumer: a volume in the pod's zone

workspaces:
  protectCIDRs: "10.0.0.0/16,172.20.0.0/16,169.254.0.0/16" # the VPC and the service CIDR

access:
  http:
    ingress:
      enabled: true
      className: alb
      host: apothecary.example.com
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip    # the engine's Service is ClusterIP
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
        alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:region:account:certificate/id
        alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # Optional: a Route 53 wildcard record to the ALB and the ACM certificate
    # covering *.apps.example.com.
    appsDomain: apps.example.com
