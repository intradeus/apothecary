# One engine, never two (strategy Recreate): it holds in-process state and
# owns the runs volume. See values.yaml, engine.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apothecaryd
  labels:
    {{- include "apothecary.labels" . | nindent 4 }}
    {{- include "apothecary.engineSelector" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "apothecary.engineSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apothecary.labels" . | nindent 8 }}
        {{- include "apothecary.engineSelector" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values | sha256sum }}
    spec:
      serviceAccountName: apothecaryd
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 0
      containers:
        - name: apothecaryd
          image: {{ include "apothecary.image" (dict "root" . "key" "apothecaryd" "name" "apothecaryd") }}
          imagePullPolicy: {{ include "apothecary.pullPolicy" . }}
          args: [serve]
          ports:
            - name: http
              containerPort: 8080
            - name: browser-proxy
              containerPort: 7071
          envFrom:
            - secretRef:
                name: {{ include "apothecary.secretName" . }}
          env:
            - name: APOTHECARY_LISTEN
              value: "0.0.0.0:8080"
            - name: APOTHECARY_RUNS_DIR
              value: /var/lib/apothecary/runs
            {{- with include "apothecary.publicURL" . }}
            - name: APOTHECARY_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.access.http.appsDomain }}
            - name: APOTHECARY_APPS_DOMAIN
              value: {{ if $.Values.access.http.port }}{{ printf "%s:%v" . $.Values.access.http.port | quote }}{{ else }}{{ . | quote }}{{ end }}
            - name: APOTHECARY_APPS_SCHEME
              value: {{ $.Values.access.http.scheme | quote }}
            {{- end }}
            {{- if .Values.engine.portAutoExpose }}
            - name: APOTHECARY_PORT_AUTOEXPOSE
              value: "on"
            {{- end }}
            {{- with .Values.engine.uploads.maxBytes }}
            - name: APOTHECARY_UPLOAD_MAX_BYTES
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- with .Values.engine.uploads.snapshotMaxBytes }}
            - name: APOTHECARY_SNAPSHOT_MAX_BYTES
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- with .Values.engine.uploads.mimeAllow }}
            - name: APOTHECARY_UPLOAD_MIME_ALLOW
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- with $.Values.otel.protocol }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.otel.headers }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.otel.resourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.log.format }}
            - name: APOTHECARY_LOG_FORMAT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.log.level }}
            - name: APOTHECARY_LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.grafanaUrl }}
            - name: APOTHECARY_GRAFANA_URL
              value: {{ . | quote }}
            {{- end }}
            - name: APOTHECARY_K8S_NAMESPACE
              value: {{ .Values.workspaces.namespace }}
            - name: APOTHECARY_K8S_ENGINE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APOTHECARY_K8S_ENGINE_URL
              value: {{ include "apothecary.engineURL" . }}
            - name: APOTHECARY_K8S_BROWSER_PROXY_ADDR
              value: apothecaryd.{{ .Release.Namespace }}.svc.{{ .Values.workspaces.clusterDomain }}:7071
            - name: APOTHECARY_K8S_PROTECT_CIDRS
              value: {{ .Values.workspaces.protectCIDRs | quote }}
            - name: APOTHECARY_K8S_TRANSPORT
              value: direct
            - name: APOTHECARY_K8S_IMAGE_PULL_POLICY
              value: {{ include "apothecary.pullPolicy" . }}
            - name: APOTHECARY_K8S_PRIVILEGED
              value: {{ ternary "on" "off" .Values.workspaces.privileged | quote }}
            {{- with .Values.workspaces.runtimeClassName }}
            - name: APOTHECARY_K8S_RUNTIME_CLASS
              value: {{ . | quote }}
            {{- end }}
            - name: APOTHECARY_SANDBOX_IMAGE
              value: {{ include "apothecary.image" (dict "root" . "key" "sandbox" "name" "sandbox") }}
            - name: APOTHECARY_SHIM_IMAGE
              value: {{ include "apothecary.image" (dict "root" . "key" "shim" "name" "shim") }}
            - name: APOTHECARY_TOOLS_IMAGE
              value: {{ include "apothecary.image" (dict "root" . "key" "tools" "name" "tools") }}
            - name: APOTHECARY_GATEWAY_IMAGE
              value: {{ include "apothecary.image" (dict "root" . "key" "gateway" "name" "egress-gw") }}
            {{- with .Values.image.overrides.browser }}
            - name: APOTHECARY_BROWSER_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- range $k, $v := .Values.engine.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: runs
              mountPath: /var/lib/apothecary/runs
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          {{- with .Values.engine.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: runs
          persistentVolumeClaim:
            claimName: apothecaryd-runs
      {{- with .Values.engine.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
