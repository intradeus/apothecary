{{- with .Values.workspaces.kataRuntimeClass }}
{{- if .create }}
{{- if and (eq (include "apothecary.sandboxRuntime" $) "kata") $.Values.workspaces.runtimeClassName (ne $.Values.workspaces.runtimeClassName .name) }}
{{- fail (printf "workspaces.kataRuntimeClass.name (%s) is not the class Kata sandboxes name (workspaces.runtimeClassName: %s)" .name $.Values.workspaces.runtimeClassName) }}
{{- end }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "apothecary.labels" $ | nindent 4 }}
handler: {{ .handler }}
{{- with .overhead }}
overhead:
  podFixed:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- if or .nodeSelector .tolerations }}
# The Kata nodes: the scheduler places every pod naming this class there.
scheduling:
  {{- with .nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
