{{- $in := .Values.access.http.ingress -}}
{{- if $in.enabled }}
# The UI and the API (and the CLI's tunnels, which are WebSockets on it); with
# an apps domain, its wildcard too. className, annotations and tls pass
# through as given, so any ingress controller or VPN operator works.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apothecaryd
  labels:
    {{- include "apothecary.labels" . | nindent 4 }}
  {{- with $in.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $in.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $in.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "access.http.ingress.host is required when the ingress is enabled" $in.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apothecaryd
                port:
                  name: http
    {{- with .Values.access.http.appsDomain }}
    - host: {{ printf "*.%s" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apothecaryd
                port:
                  name: http
    {{- end }}
{{- end }}
