        - max_bytes
        - max_files
        - mime_allow
      type: object
    Uploaded:
      properties:
        attachments:
          items:
            $ref: '#/components/schemas/Attachment'
          nullable: true
          type: array
      required:
        - attachments
      type: object
    User:
      properties:
        admin:
          type: boolean
        created_at:
          format: date-time
          type: string
        disabled_at:
          format: date-time
          type: string
        email:
          type: string
        handle:
          type: string
        id:
          type: string
        last_seen_at:
          format: date-time
          type: string
        name:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - admin
        - created_at
        - email
        - handle
        - id
        - name
        - updated_at
      type: object
    UserCreateRequest:
      properties:
        admin:
          type: boolean
        email:
          type: string
        handle:
          type: string
        name:
          type: string
        password:
          type: string
      required:
        - email
        - handle
        - password
      type: object
    UserUpdateRequest:
      properties:
        admin:
          nullable: true
          type: boolean
        disabled:
          nullable: true
          type: boolean
        email:
          type: string
        handle:
          type: string
        name:
          type: string
      type: object
    ValidateFlowRequest:
      properties:
        params:
          additionalProperties:
            type: string
          type: object
        yaml:
          type: string
      required:
        - yaml
      type: object
    WorkspaceChangedFile:
      properties:
        additions:
          type: integer
        binary:
          type: boolean
        committed:
          type: boolean
        deletions:
          type: integer
        old_path:
          type: string
        path:
          type: string
        status:
          type: string
      required:
        - additions
        - committed
        - deletions
        - path
        - status
      type: object
    WorkspaceChanges:
      properties:
        base:
          type: string
        branch:
          type: string
        commits:
          items:
            $ref: '#/components/schemas/WorkspaceCommit'
          nullable: true
          type: array
        files:
          items:
            $ref: '#/components/schemas/WorkspaceChangedFile'
          nullable: true
          type: array
        head:
          type: string
        merge_base:
          type: string
      required:
        - base
        - branch
        - commits
        - files
        - head
        - merge_base
      type: object
    WorkspaceCommit:
      properties:
        sha:
          type: string
        subject:
          type: string
      required:
        - sha
        - subject
      type: object
    WorkspaceConfig:
      properties:
        blocked_domains:
          items:
            type: string
          type: array
        browser:
          $ref: '#/components/schemas/BrowserConfig'
        code_server_extensions:
          items:
            type: string
          type: array
        denied_domains:
          items:
            type: string
          type: array
        editor:
          $ref: '#/components/schemas/EditorConfig'
        egress_allowed_cidrs:
          items:
            type: string
          type: array
        egress_allowed_ports:
          items:
            type: integer
          type: array
        egress_mode:
          type: string
        extra_domains:
          items:
            type: string
          type: array
        services:
          items:
            $ref: '#/components/schemas/ServiceConfig'
          type: array
      type: object
    WorkspaceDiff:
      properties:
        diff:
          type: string
        path:
          type: string
        truncated:
          type: boolean
      required:
        - diff
        - path
        - truncated
      type: object
    WorkspaceEntry:
      properties:
        dir:
          type: boolean
        ignored:
          type: boolean
        name:
          type: string
        path:
          type: string
        size:
          format: int64
          type: integer
      required:
        - dir
        - name
        - path
      type: object
    WorkspaceFile:
      properties:
        binary:
          type: boolean
        content:
          type: string
        path:
          type: string
        size:
          format: int64
          type: integer
        truncated:
          type: boolean
      required:
        - binary
        - content
        - path
        - size
        - truncated
      type: object
    sourceAttachmentJSON:
      properties:
        filename:
          type: string
        mime:
          type: string
        size:
          format: int64
          type: integer
      required:
        - filename
      type: object
  securitySchemes:
    personalToken:
      description: A personal API token (POST /api/me/tokens), sent as a bearer token.
      scheme: bearer
      type: http
    runToken:
      description: Per-run token, issued to the in-workspace shim. Not a user credential.
      scheme: bearer
      type: http
    session:
      description: A browser session, started by POST /api/auth/login (or setup).
      in: cookie
      name: apothecary_session
      type: apiKey
info:
  description: The engine's whole surface. The control-plane UI talks only to this API, and its client is generated from this document.
  title: Apothecary engine API
  version: 1.1.0
openapi: 3.0.3
paths:
  /api/actions:
    get:
      operationId: listActions
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Action'
                nullable: true
                type: array
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Actions an `action` stage may name
      tags:
        - system
  /api/attachments:
    post:
      operationId: uploadAttachments
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                files:
                  items:
                    format: binary
                    type: string
                  type: array
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uploaded'
          description: Created
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Upload files to attach to a ticket, a goal or an answer
      tags:
        - files
  /api/attachments/{id}:
    get:
      operationId: downloadAttachment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: No Content
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "404":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Download one uploaded file
      tags:
        - files
  /api/attachments/limits:
    get:
      operationId: getAttachmentLimits
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLimits'
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: 'Upload policy: size cap and accepted types'
      tags:
        - files
  /api/auth/login:
    post:
      description: method is password unless the instance offers another; login is a handle or an email; proof the password. Repeated failures for one account from one address are throttled (429).
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security: []
      summary: Sign in and start a browser session
      tags:
        - auth
  /api/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: End the browser session
      tags:
        - auth
  /api/auth/setup:
    post:
      description: Only while no account exists (409 after).
      operationId: setupInstance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: Created
        "400":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security: []
      summary: 'Claim a fresh instance: create its first account, an admin, and sign in'
      tags:
        - auth
  /api/auth/status:
    get:
      operationId: getAuthStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security: []
      summary: Whether the instance needs its first account, and how one may sign in
      tags:
        - auth
  /api/channels:
    get:
      operationId: listChannels
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ChannelEntry'
                nullable: true
                type: array
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: One's notification channels (secrets masked)
      tags:
        - channels
    post:
      operationId: addChannel
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: {}
              nullable: true
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelEntry'
          description: Created
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Add a notification channel
      tags:
        - channels
  /api/channels/{id}:
    delete:
      operationId: deleteChannel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "404":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Remove a notification channel
      tags:
        - channels
  /api/egress-defaults:
    get:
      operationId: getEgressDefaults
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EgressDefaults'
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: The built-in allowlist every project starts from
      tags:
        - egress
  /api/envchecks/{id}:
    delete:
      description: The check stops at its next step and still destroys its workspace.
      operationId: cancelEnvCheck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "404":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Cancel a running workspace check
      tags:
        - projects
    get:
      operationId: getEnvCheck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvCheck'
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "404":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Poll a workspace check
      tags:
        - projects
  /api/flow-templates:
    get:
      operationId: listFlowTemplates
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Flow'
                nullable: true
                type: array
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: The compiled-in flow templates a project can adopt or copy
      tags:
        - flows
  /api/flow-templates/{name}/copy:
    post:
      description: 'A template belongs to no project, so it is copied from here rather than from under one. Copying it under its own name adopts it: the project gets its own editable document, which shadows the template from then on.'
      operationId: copyFlowTemplate
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyFlowRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
          description: Created
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "404":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Copy a compiled-in template into a project
      tags:
        - flows
  /api/flows:
    get:
      operationId: listAllFlows
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Flow'
                nullable: true
                type: array
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Every flow of one's projects, for the cross-project overview
      tags:
        - flows
  /api/flows/schema:
    get:
      description: 'The YAML with its shorthand, for an editor to validate, complete and document as a person types; its lists (stage types, signals, actions and their inputs) come from the registries. The parser stays the authority: validate a document for the rules a schema cannot say.'
      operationId: getFlowSchema
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                nullable: true
                type: object
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: The JSON Schema of a flow document as it is written
      tags:
        - flows
  /api/flows/validate:
    post:
      description: 'Project-independent: the parser checks the document itself, and a flow carries its own agents.'
      operationId: validateFlow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateFlowRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowValidation'
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Validate a flow document without saving it
      tags:
        - flows
  /api/integrations:
    get:
      operationId: listIntegrations
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Integration'
                nullable: true
                type: array
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: One's integrations (secrets masked)
      tags:
        - integrations
    post:
      operationId: createIntegration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
          description: Created
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
