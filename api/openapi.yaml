  securitySchemes:
    brokerToken:
      description: Per-run auth-broker token, issued to omp in the run's workspace. Not a user credential.
      scheme: bearer
      type: http
    personalToken:
      description: A personal API token (POST /api/me/tokens), sent as a bearer token.
      scheme: bearer
      type: http
    runToken:
      description: Per-run token, issued to the in-workspace shim. Not a user credential.
      scheme: bearer
      type: http
    session:
      description: A browser session, started by POST /api/auth/login (or setup).
      in: cookie
      name: apothecary_session
      type: apiKey
info:
  description: The engine's whole surface. The control-plane UI talks only to this API, and its client is generated from this document.
  title: Apothecary engine API
  version: 1.2.0
openapi: 3.0.3
paths:
  /api/actions:
    get:
      operationId: listActions
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Action'
                nullable: true
                type: array
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Actions an `action` stage may name
      tags:
        - system
  /api/analytics/catalog:
    get:
      operationId: getAnalyticsCatalog
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsCatalog'
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Every grain, dimension and measure a query may name
      tags:
        - analytics
  /api/analytics/dashboards:
    get:
      operationId: listDashboards
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Dashboard'
                nullable: true
                type: array
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: The built-in dashboards, then one's own
      tags:
        - analytics
    post:
      operationId: createDashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: Created
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Create a dashboard
      tags:
        - analytics
  /api/analytics/dashboards/{id}:
    delete:
      operationId: deleteDashboard
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "404":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Delete a dashboard (409 on a built-in)
      tags:
        - analytics
    get:
      operationId: getDashboard
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "404":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: One dashboard
      tags:
        - analytics
    put:
      operationId: updateDashboard
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "404":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Replace a dashboard's name, filters and panels (409 on a built-in)
      tags:
        - analytics
  /api/analytics/drill:
