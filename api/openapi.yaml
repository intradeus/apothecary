        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "404":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: Delete an integration
      tags:
        - integrations
    get:
      operationId: getIntegration
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "404":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: One integration
      tags:
        - integrations
    put:
      operationId: updateIntegration
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationUpdate'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
          description: OK
        "400":
          content:
            application/json: {}
          description: error
        "401":
          content:
            application/json: {}
          description: error
        "404":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
