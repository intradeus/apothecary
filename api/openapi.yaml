          description: error
        "401":
          content:
            application/json: {}
          description: error
        "409":
          content:
            application/json: {}
          description: error
        "503":
          content:
            application/json: {}
          description: error
      security:
        - session: []
        - personalToken: []
      summary: The runs behind a group (at most 200, newest first)
      tags:
        - analytics
  /api/analytics/query:
    post:
      description: A whitelisted shape — grain, measures, group-by, filters, time range — checked against the catalog. At most 8 measures, 3 group-by dimensions, 10 filters and 500 rows; 422 when it runs longer than 5s.
      operationId: queryAnalytics
      requestBody:
