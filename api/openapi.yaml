        expires_at:
          format: date-time
          type: string
        id:
          type: string
        last_used_at:
          format: date-time
          type: string
        name:
          type: string
        prefix:
          type: string
      required:
        - created_at
        - id
        - name
        - prefix
      type: object
    TokenCreated:
      properties:
        secret:
          type: string
        token:
          $ref: '#/components/schemas/Token'
      required:
        - secret
        - token
      type: object
    TokenRequest:
      properties:
        expires_at:
          format: date-time
          type: string
        name:
          type: string
      required:
        - name
      type: object
    TriggerHold:
      properties:
        key:
