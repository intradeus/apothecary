name: reviewer
version: 5
description: "review a merge request someone opened: notes on its lines and a summary, again after every push, until it merges or closes"
operates_on: merge_request
# A run of this flow is started on a merge request a person opened — from the
# workshop's Repositories tab, or by a merge-request automation watching the
# repository. It never builds and never pushes: it checks out
# the merge request's head, reads the change, and posts a review — notes on
# the lines they are about, a summary on top. It never approves nor requests
# changes; that decision stays a person's.
#
# The run then waits. Each time the author pushes and stops for a while
# ($rereview_quiet), the `again` watcher reviews again, the checkout brought to the new head
# first, with its earlier review in hand so it says what is new rather than
# repeating itself. The merge request merging or closing ends the run: there
# is nothing left to review.
parameters:
  harness: opencode
  model: opencode-go/glm-5.2
  timeout: 20m
  max_turns: 40
  max_cost_usd: 3.0
  max_total_turns: 160
  review_gate:    { type: bool, default: false, description: "a person reads each review before it is posted" }
  rereview_quiet: { type: duration, default: 10m, description: "how long the author's pushes must stop before a re-review" }
agents:
  - name: pr_reviewer
    description: reviews a merge request someone else wrote
    read_only: true
    allow_bash: true
    inputs:
      - { name: ticket, type: ticket, optional: true, description: "what the merge request is for" }
      - { name: changes, type: changeset, description: "the files the merge request changes against its target branch" }
      - { name: rejection, type: verdict, optional: true, description: "why a person sent the last draft of this review back" }
      - { name: failure, type: failure, optional: true, description: "why the last review file was refused" }
    outputs:
      - { name: review, type: review_threads, description: "the review — a summary, and notes on lines of the changed files" }
    prompt: |
      You review a merge request someone else wrote. The TASK section is the
      merge request: its title and its author's description. The checkout is
      its branch at its current head; the changes input lists the files it
      changes against its target branch.

      Method:
      1. Read the description to learn what the change claims to do, then read
         every changed file — the whole function or block around each change,
         not only the changed lines — and AGENTS.md for the project's
         conventions.
      2. Run the project's tests or linters with bash when they settle a
         question (does this break anything, is this covered). Never modify,
         commit or push anything: you read and you write the review file.
      3. Look for what matters, in this order: the change does not do what it
         says, or breaks something that worked; unhandled errors, edge cases,
         concurrency and security problems; missing or weak tests for what
         changed; conventions of this codebase it ignores. Leave formatting to
         the linters.
      4. If the file named in the OUTPUT CONTRACT section already exists, it is
         your review of an earlier version of this merge request: read it first.
         Do not repeat a note the author has addressed; say so in the summary
         instead, and keep only the notes that still apply.

      Write the review file as YAML:

        summary: |
          Two or three sentences: what the change does, whether it does it, and
          the one or two things that most need the author's attention.
        threads:
          - path: internal/flow/parse.go
            line: 412
            body: "[blocking] This error drops the line number the caller needs: ..."

      Each thread is about one line of the NEW version of a changed file: path
      relative to the repository root, line as numbered in that file now —
      check it, a note on the wrong line is noise. Start each body with
      [blocking], [suggestion], [question] or [nit], then say what is wrong and
      what would fix it. At most fifteen threads: if there is more to say, say
      it in the summary. A change with nothing worth a note gets a summary and
      no threads — an empty review is a fine review.

      If your prompt carries a rejection, a person read your last draft: do what
      they asked. If it carries a failure, your last review file did not parse:
      fix exactly what the failure names.
sequences:
  # Read the change, let a person read the review when the workshop wants
  # one, post it. The same chain reviews the merge request as it was opened
  # and after every push.
  - id: review
    description: "read the change, optionally let a person read the review, post it"
    stages:
      - id: read
        type: agent
        agent: pr_reviewer
        input:
          ticket:    { from: run.ticket, type: ticket }
          changes:   { from: run.git.diff_target, type: changeset }
          rejection: { from: edge.verdict, type: verdict, optional: true }
          failure:   { from: edge.failure, type: failure, optional: true }
        output:
          review:    { to: artifacts/review.yaml, type: review_threads }
        on_fail: { to: read, max: 1, then: debug }
      - id: gate
        type: human_gate
        run_if: $review_gate
        question: "Post this review on the merge request? Rejecting sends it back with your feedback."
        input:
          review: { from: artifacts/review.yaml, type: review_threads }
        on_reject: { to: read, max: -1 }
      - id: post
        type: action
        action: post_review
        input:
          review: { from: artifacts/review.yaml, type: review_threads }
        on_fail: debug
# The first review, of the merge request as it was opened.
main:
  - { id: review, sequence: review }
watchers:
  # The author pushed and stopped: review what the merge request is now.
  - id: again
    on: { signal: mr_head_moved, quiet_for: $rereview_quiet }
    description: "the author pushed: review what the merge request is now"
    stages:
      - { id: rereview, sequence: review }
outcomes:
  # Merged or closed: nothing left to review.
  - { id: merged, on: mr_merged, then: done, description: "it merged: the review is over" }
  - { id: closed, on: mr_closed, then: done, description: "it was closed: the review is over" }
