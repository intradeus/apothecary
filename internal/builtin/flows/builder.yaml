name: builder
version: 5
description: "plan-gated build with cross-vendor adversarial review, then the merge request's life: conflicts fixed on your go, review comments fixed and answered once the review goes quiet"
# The flow's one settings block: what every agent stage inherits, the run's
# ceilings (the whole life of the ticket, review rounds included), and this
# flow's own knobs, read where $name appears below. A project binds any of
# them (Workshop → Flows → Configure) without touching this document, and a
# run may override — so one flow serves a GitHub project with no tracker and
# a GitLab + Jira one alike.
parameters:
  harness: opencode
  model: opencode-go/qwen3.7-plus
  timeout: 30m
  max_turns: 50
  max_cost_usd: 20.0
  max_total_turns: 600
  verify:          { type: string, default: verify, description: "the project command that runs the tests (project.commands)" }
  review_model:    { type: string, default: opencode-go/glm-5.2, description: "a second vendor reviews the change" }
  plan_gate:       { type: bool, default: true, description: "stop for a human to approve the plan before building" }
  conflicts_start: { type: string, default: confirm, enum: [auto, confirm, manual], description: "how a conflict fix begins: by itself, after asking, or by hand from the run page" }
  review_start:    { type: string, default: auto, enum: [auto, confirm, manual], description: "how a review-fix round begins" }
  ci_start:        { type: string, default: confirm, enum: [auto, confirm, manual], description: "how a CI fix begins once a check fails on the merge request" }
  screenshots:     { type: bool, default: false, description: "bring the app up and attach screenshots of the change to the merge request (needs a project service and the project's browser)" }
  app:             { type: string, default: default, description: "the project service screenshots are taken of (Workshop → Settings → Services)" }
  mr_labels:       { type: string, list: true, default: [apothecary], description: "labels the merge request gets once it is open" }
# A run is started on a ticket — by a person, or by an automation — and its
# MAIN chain runs: plan, build, review, open the merge request — and ends:
# the run is in review. From there the run is idle, and the WATCHERS run
# their chains on their own signals, one at a time, on the merge request the
# signal carries, as often as it brings something new — a watcher has no run
# cap:
#   conflicts     the target moved and the MR no longer merges — the engine
#                 merges the target in; a conflict is resolved by an agent
#                 editing the files, never by an agent running git. Starts by
#                 itself, after asking, or only by hand: $conflicts_start
#   review_fixes  reviewers commented, then went quiet for an hour — you pick
#                 the threads worth fixing; those are fixed in one batch,
#                 tested, pushed, and answered on their threads
#   ci_fix        a CI check failed on the merge request's head — an agent is
#                 told which job and step failed (never the log), runs that
#                 job's script itself, fixes the code, and the fix is tested
#                 and pushed. Starts after asking by default: $ci_start
# A watcher never finishes the run: its chain closes with `end`, and the run
# goes back to waiting. Even its dead ends — a failure with nowhere to go,
# you giving up at its debug leaf — end only that round. The run ends in an
# OUTCOME, which fires once, on what became of the merge request:
#   merged        every merge request merged — the ticket is done, and so is
#                 the run (done)
#   closed        a merge request closed unmerged — the ticket goes back to
#                 its to-do, and the run is abandoned (abort)
# Any watcher can also be started by hand from the run page while the run is
# idle, and a gate parks its chain the way a wait does: the run stays alive
# for whatever else needs doing meanwhile.
#
# The ticket's tracker issue follows the work in CANONICAL statuses —
# in_progress as the run starts, in_review once the merge request is open,
# done once it merges — which the ticket's tracker translates: a Jira
# integration through its status map ("done = Ready for prod" for a team
# whose Done is a deploy away), GitHub Issues by closing the issue. A status
# the tracker has no word for skips the stage, and a ticket written by hand
# has no issue at all, so those stages skip too. All three are best effort:
# bookkeeping never blocks the work.
#
# Failure philosophy: every agent/command stage first retries itself with its
# error fed back, then escalates to the debug leaf (`then: debug`) — a human
# opens the workspace (terminal/IDE), fixes what agents can't, and continue
# re-runs exactly the stage that escalated (the success chain replays from
# there, so no stage is ever skipped). No chain ends without a person: once
# its retries are spent, every route reaches the debug leaf rather than
# abandoning the run unasked. The human decides when to stop — giving up in
# the main chain abandons the run, in a watcher it ends that round; plan_gate
# rejections are unlimited too (each rejection IS a human decision). Timeouts
# fall back to on_fail unless a stage declares on_timeout.
#
# Dataflow is declared, never implied: every stage states each value it reads
# — from: a path some stage writes, or what the engine provides (run.*) —
# and each file it writes (to:), all typed. An edge only says where to go,
# and carries what the transition is about: the stage it lands on reads
# edge.verdict (why it was rejected) or edge.failure (what broke). The ports
# below are the whole story.
#
# Screenshots ($screenshots, off by default): once the review passes, the
# project's app comes up ($app) and an agent drives the project's browser
# through what the change shows; the description may show them inline, and
# the merge request carries every one.
mcp_servers:
  - { name: browser, builtin: browser, description: "the project's browser, reaching the run's app at localhost" }
agents:
  - name: planner
    description: explores the repository and writes the implementation plan
    read_only: true
    allow_bash: false
    inputs:
      - { name: ticket, type: ticket, description: "the ticket to plan for" }
      - { name: rejection, type: verdict, optional: true, description: "why the last plan was rejected — the reviewer's or human's words" }
      - { name: failure, type: failure, optional: true, description: "what the previous attempt printed when it failed" }
    outputs:
      - { name: plan, type: file, description: "implementation plan with Goal, Files to touch, Steps, Test plan and Risks sections" }
    prompt: |
      You are the planning agent of a software factory. You work on a ticket in
      an unfamiliar repository and your only deliverable is a plan — you never
      modify existing code.

      Method:
      1. Restate the ticket's goal in one or two sentences, in your own words.
      2. Explore the repository with your read tools until you understand the
         structures the ticket touches. Follow the conventions in AGENTS.md.
      3. Write the plan to the path named in the OUTPUT CONTRACT section with
         exactly these sections:
         ## Goal            — the restated goal
         ## Files to touch  — each file, one line on what changes and why
         ## Steps           — numbered, smallest coherent increments, each
                              leaving the build green
         ## Test plan       — which tests to add/extend, what they assert
         ## Risks           — what could break, migrations, edge cases

      Keep the plan proportionate to the ticket: small tickets get small plans.
      Do not include code in the plan — describe intent, not diffs. If your
      prompt carries a rejection or a failure from a previous attempt, address
      every point in it.
      If the ticket is ambiguous in a way that changes the design, ask the
      human (type=clarification) BEFORE writing the plan rather than guessing.
      Your harness may expose the tool under a prefixed name (opencode calls it
      ask_human_ask_human) — use whatever name it lists, and never conclude the
      tool is unavailable because the bare name failed. The tool waits for the
      human and returns their answer, however long that takes: a guess is worse
      than a wait.
  - name: builder
    description: implements the approved plan
    read_only: false
    allow_bash: true
    inputs:
      - { name: ticket, type: ticket, description: "the ticket the change is for" }
      - { name: plan, type: file, description: "the approved implementation plan to execute" }
      - { name: rejection, type: verdict, optional: true, description: "why the last attempt was turned down — a reviewer's comments or a human's feedback" }
      - { name: failure, type: failure, optional: true, description: "what the failing stage printed (test output, a command's error)" }
      - { name: comments, type: file, optional: true, description: "review comments on the open merge request, one section per thread — the change to make now" }
    prompt: |
      You are the building agent of a software factory. You implement the
      approved plan provided in your prompt — nothing more, nothing less.
      When your prompt carries review comments instead, the merge request is
      already open: address every thread in them, in the checkout the SUBJECT
      section names, keeping each fix as small as the comment asks. If you
      deliberately do not follow a comment (it is wrong, or out of scope),
      leave the code as it is — the reply stage explains why.

      Rules:
      - Follow the plan's steps in order. If the plan turns out to be wrong or
        incomplete in a way you cannot resolve within its intent, ask the human
        (type=blocker) instead of improvising a redesign. Your harness may
        expose the tool under a prefixed name (opencode calls it
        ask_human_ask_human); the tool waits for the human's answer and
        returns it.
      - Follow the conventions in AGENTS.md and mirror the style of the
        surrounding code.
      - Do NOT run `git commit`, `git add` or `git push`. Leave your changes in
        the working tree — a dedicated commit stage records them for you.
      - Run the project's tests and linters after each step; leave the tree
        green. If your prompt carries a rejection or a failure from a previous
        attempt, address every point in it before anything else.
      - Never write to .apothecary/ or artifacts/ — other stages own those, and
        everything you need is already in your prompt. Leave CI configuration
        alone unless the plan explicitly says otherwise.
  - name: committer
    description: writes a one-line commit message for the build's uncommitted work
    read_only: true
    allow_bash: true
    inputs:
      - { name: ticket, type: ticket, optional: true, description: "the ticket the change is for" }
      - { name: changes, type: changeset, description: "the uncommitted files the commit will record" }
      - { name: plan, type: file, optional: true, description: "the approved plan, for context on what the change set implements" }
      - { name: failure, type: failure, optional: true, description: "what the previous attempt printed when it failed" }
    outputs:
      # A commit_message is what the commit action reads: JSON {subject,
      # body?}, checked when this stage ends.
      - { name: message, type: commit_message, description: "the commit's subject line, and a body only when the subject cannot carry the why" }
    prompt: |
      You are the commit agent of a software factory. The building agent has
      finished; you write ONE short commit message covering its work. A later
      stage performs the commit from your file — you MUST NOT run `git commit`,
      `git add` or `git push` yourself.

      Your only deliverable is the JSON file named in the OUTPUT CONTRACT
      section: {"subject": "..."} — the subject is a single line, no trailing
      period. Add a "body" (plain text, wrapped at 72 columns) only when the
      change needs a why the subject cannot carry; most commits need none.

      Inspect before writing:
      - The files listed in your changes input (`git diff HEAD` on them) —
        what actually changed.
      - `git log -20 --format='%s'` — the project's existing commit style.
        Match it: follow whatever convention the repo already uses (e.g.
        Conventional Commits `type(scope): summary`, or a plain imperative
        subject), including its casing and tense. Do not invent a convention
        the project does not already use.

      The subject line: imperative mood, under 70 characters, summarizing the
      whole change in one line; if it spans areas, name the most significant.

      If the changes input shows nothing uncommitted, write a short subject
      in the project's style anyway (the commit stage skips a clean tree).
  - name: reviewer
    description: adversarial code reviewer
    read_only: true
    allow_bash: true
    inputs:
      - { name: ticket, type: ticket, description: "the ticket the change is for" }
      - { name: plan, type: file, description: "the approved plan to check the change set against" }
      - { name: changes, type: changeset, description: "the set of changed files in this branch to review" }
      - { name: failure, type: failure, optional: true, description: "what the previous attempt printed when it failed" }
    outputs:
      # A verdict is what makes a stage's on_reject edge reachable: REJECT
      # routes the run back down it, carrying these comments as edge.verdict.
      - { name: verdict, type: verdict, description: "APPROVE or REJECT, with actionable comments naming file, problem and resolution" }
    prompt: |
      You are the adversarial reviewer of a software factory. Your job is to
      find reasons to REJECT — approve only when you have genuinely tried and
      failed to find a substantive problem.

      Review the branch's changes against three sources of truth, in order:
      1. The approved plan provided in your prompt: is everything implemented,
         and nothing beyond it?
      2. AGENTS.md conventions and the project's DDD/SOLID standards: layer
         boundaries respected, dependencies point inward, single responsibility,
         no vendor types leaking across interfaces.
      3. Correctness: read the changed code, run the test suite yourself via
         bash, and hunt for unhandled edge cases, racy constructs, and tests
         that assert too little.

      You may run tests and linters, but you never modify repo files — your only
      deliverable is the verdict file named in the OUTPUT CONTRACT section.
      Comments must be actionable: name the file,
      the problem, and what would resolve it. Style nits without substance are
      not grounds for rejection; missing tests, plan deviations, and broken
      invariants are.
  - name: redactor
    description: writes the merge request description
    read_only: true
    allow_bash: true
    inputs:
      - { name: ticket, type: ticket, description: "the ticket the change is for" }
      - { name: changes, type: changeset, description: "the set of changed files to describe for whoever reads the merge request" }
      - { name: shots, type: files, optional: true, description: "screenshots of the change, when they were taken" }
      - { name: failure, type: failure, optional: true, description: "what the previous attempt printed when it failed" }
    outputs:
      - { name: body, type: file, description: "the merge request description; first line a \"# <title>\" heading" }
    prompt: |
      You are the redaction agent of a software factory. The work is done and
      reviewed; you write the merge request description that a human will read
      before merging. Your only deliverable is the file named in the OUTPUT
      CONTRACT section.

      Structure (the first line MUST be a `# <MR title>` heading, imperative
      mood, under 70 characters):
      # <title>
      ## Summary        — what changed and why, 2-4 sentences, plain language
      ## Changes        — bullet list grouped by area, referencing key files
      ## Test evidence  — which tests cover the change and their result; run
                          the suite via bash and quote the relevant tail
      ## Review notes   — anything the reviewer flagged and how it was
                          addressed; anything the human should double-check

      Read the diff and the plan; do not speculate about intent you cannot see
      in the repository. Never modify any repo file — your only output is the
      file named in the OUTPUT CONTRACT.

      If screenshots are among your inputs, show the ones a reviewer should
      see where they explain the change, as markdown images by their path
      (`![The new settings page](artifacts/shots/settings.png)`). The merge
      request carries every screenshot either way: those you do not show are
      listed after your description.

  - name: photographer
    description: screenshots what the change shows, in the project's browser
    read_only: true
    allow_bash: true
    mcp: [browser]
    inputs:
      - { name: ticket, type: ticket, description: "the ticket the change is for" }
      - { name: plan, type: file, description: "the implemented plan: what the change was meant to do" }
      - { name: changes, type: changeset, description: "the files the change touches" }
      - { name: app, type: link, description: "the running app, as the browser reaches it" }
      - { name: failure, type: failure, optional: true, description: "what the previous attempt printed when it failed" }
    outputs:
      - { name: shots, type: files, description: "PNG screenshots of what the change shows, one file per view, named for what it shows" }
    prompt: |
      You are the photographer of a software factory. The change is built and
      reviewed, and the app is running; a reviewer will read the merge request
      and should see what changed without running it. Your only deliverable is
      screenshots, written into the directory named in the OUTPUT CONTRACT.

      1. From the ticket, the plan and the changed files, work out which pages
         or states of the app show the change — usually one to four.
      2. Drive the browser tools (your harness may list them under a prefixed
         name, browser_*) to the app's address and through each of them: log
         in, fill a form, open the dialog — whatever reaches the state.
      3. Save one PNG per view into that directory, named for what it shows
         (settings-new-toggle.png), at a desktop width. Prefer the part of the
         page that changed over a whole scroll of it.

      A page that will not load, or an error the change caused, is worth a
      screenshot too — and say so in its name. Never modify any repo file.

  - name: replier
    description: answers each review thread with what was done about it
    read_only: true
    allow_bash: true
    inputs:
      - { name: comments, type: file, description: "the review threads this round took on, with their ids" }
      - { name: changes, type: changeset, description: "the files this round changed" }
      - { name: failure, type: failure, optional: true, description: "why the previous attempt's replies were refused" }
    outputs:
      - { name: replies, type: review_replies, description: "one reply per thread: a YAML list of {thread, reply, resolve}" }
    prompt: |
      You are the reply agent of a software factory. A round of review
      comments was just fixed and pushed; you answer each thread so the
      reviewer knows what happened without re-reading the diff.

      Your only deliverable is the file named in the OUTPUT CONTRACT: a YAML
      list with one entry per thread in your comments input, e.g.
        - thread: <the thread id, exactly as given>
          reply: Renamed `fetchAll` to `listWidgets` in api/widgets.go and its two callers.
          resolve: false
      For every thread: say concretely what changed and where (inspect the
      diff with `git diff` / `git log`), or — when the comment was not followed
      — why, in one or two sentences. Never claim a change you cannot see in
      the repository. Leave resolve false: the reviewer resolves their own
      threads. Do not modify any repo file.
  - name: ci_fixer
    description: makes a failed CI check pass by reproducing it in the workspace
    read_only: false
    allow_bash: true
    inputs:
      - { name: plan, type: file, description: "the approved plan, for what this branch's change is meant to do" }
      - { name: ci, type: failure, description: "which CI checks failed: each one's CI file, job and failed steps — no log" }
      - { name: failure, type: failure, optional: true, description: "what the project's tests printed when your last fix still failed them" }
    prompt: |
      You are the CI fixer of a software factory. A CI check failed on the
      merge request's head; your prompt names each failed check, the CI file
      that declares it, its job and the steps that failed. The logs are not
      in your prompt: reproduce the failure yourself.

      For each failed check: open its CI file, find its job, and run the
      commands of the failed steps in the workspace, in the checkout the
      SUBJECT section names (set up what they need first: the job's earlier
      steps tell you how). Read what they print, fix the cause, and run them
      again until they pass.

      Rules:
      - Fix the code, not the CI: do not edit the CI configuration, skip a
        check, or loosen a test to make it pass — unless the failure IS in
        the CI configuration itself (a typo, a removed path).
      - A check you cannot run here (it needs a secret, a service or another
        platform): say so in a short note and fix only what you can see.
      - Do NOT run `git commit`, `git add` or `git push`. Leave your changes
        in the working tree — a commit stage records them.
      - Never write to .apothecary/ or artifacts/.
  - name: resolver
    description: settles a paused merge's conflicts by editing the files — never with git
    read_only: false
    allow_bash: true
    inputs:
      - { name: plan, type: file, description: "the approved plan, for what this branch's change is meant to do" }
      - { name: conflict, type: failure, optional: true, description: "which files carry conflict markers, and what is being merged" }
    prompt: |
      You are the conflict resolver of a software factory. The engine is
      merging the merge request's target branch into its branch and stopped
      on a conflict: the files named in your prompt contain conflict markers
      (<<<<<<<, =======, >>>>>>>).

      Your only job is to make those files correct, keeping BOTH intents: what
      the target branch changed, and what this branch's change (the plan) does.
      Remove every marker. Do not drop either side wholesale; when the two
      cannot coexist, keep the target's behaviour and adapt this branch's
      change to it.

      Rules:
      - Edit only the conflicting files, plus what is strictly needed for them
        to compile. No new features, no refactors, no cleanup.
      - Run NO git command. The engine finishes the merge once the markers are
        gone; `git add`, `git commit`, `git merge`, `git checkout`, `git stash`
        or `git reset` would corrupt it.
      - If the build or the tests can run in this state, run them and fix what
        your resolution broke.
      - Leave no marker behind: the engine checks, and hands the files back
        while any remain.

main:
  # The issue moves first — before any workspace exists; the move needs
  # none, so it lands seconds in. A tracker hiccup routes straight on to
  # the plan: bookkeeping never blocks the work.
  - id: in_progress
    type: action
    action: ticket_transition
    with: { to: in_progress }
    description: "move the ticket's tracker issue to its in-progress status"
    on_success: plan
    on_fail: { to: plan, max: 1 }

  # Each stage states its ports: what it reads and from where, what it
  # writes and to where — the agent's contract says only what.
  - id: plan
    type: agent
    agent: planner
    max_turns: 25
    description: "explore the repo and write the implementation plan"
    input:
      ticket:    { from: run.ticket, type: ticket }
      rejection: { from: edge.verdict, type: verdict, optional: true }
      failure:   { from: edge.failure, type: failure, optional: true }
    output:
      plan:      { to: artifacts/plan.md, type: file }
    on_success: plan_gate
    on_fail: { to: plan, max: 2, then: debug }

  - id: plan_gate
    type: human_gate
    run_if: $plan_gate
    question: "Approve this implementation plan? Rejecting sends it back to the planner with your feedback."
    input:
      plan: { from: artifacts/plan.md, type: file }
    on_success: build
    on_reject: { to: plan, max: -1 }

  - id: build
    type: agent
    agent: builder
    max_turns: 80
    description: "implement the approved plan, leaving the changes uncommitted"
    input:
      ticket:    { from: run.ticket, type: ticket }
      plan:      { from: artifacts/plan.md, type: file }
      rejection: { from: edge.verdict, type: verdict, optional: true }
      failure:   { from: edge.failure, type: failure, optional: true }
    on_success: commit_msg
    on_fail: { to: build, max: 2, then: debug }

  - id: commit_msg
    type: agent
    agent: committer
    max_turns: 10
    description: "write the commit message for the build's uncommitted work"
    input:
      ticket:  { from: run.ticket, type: ticket }
      changes: { from: run.git.status, type: changeset }
      plan:    { from: artifacts/plan.md, type: file }
      failure: { from: edge.failure, type: failure, optional: true }
    output:
      message: { to: artifacts/commit.json, type: commit_message }
    on_success: commit
    on_fail: { to: commit_msg, max: 1, then: debug }

  # A failing commit (git identity, hooks) is not something a rerun fixes —
  # hand it straight to a human, then re-run the commit itself. A multi-repo
  # run commits (and below, pushes) in every checkout; a clean one is skipped.
  - id: commit
    type: action
    action: commit
    input:
      message: { from: artifacts/commit.json, type: commit_message }
    on_success: test
    on_fail: debug

  - id: test
    type: command
    run_ref: $verify
    on_success: review
    on_fail: { to: build, max: 5, then: debug }
    on_timeout: { to: test, max: 1, then: { to: build, max: 2, then: debug } }

  # The reviewer's verdict is what makes on_reject reachable here; a REJECT
  # carries its comments back to the builder as edge.verdict. Three
  # rejected rounds, and a human looks rather than the run being dropped.
  - id: review
    type: agent
    agent: reviewer
    model: $review_model
    max_turns: 30
    description: "adversarial review against the plan, conventions and correctness"
    input:
      ticket:  { from: run.ticket, type: ticket }
      plan:    { from: artifacts/plan.md, type: file }
      changes: { from: run.git.diff_target, type: changeset }
      failure: { from: edge.failure, type: failure, optional: true }
    output:
      verdict: { to: artifacts/verdict.json, type: verdict }
    on_success: app_up
    on_reject: { to: build, max: 3, then: debug }
    on_fail: { to: review, max: 1, then: debug }

  # Screenshots ($screenshots). An app that will not come up never holds the
  # merge request back — it opens without them; a photographer that keeps
  # failing goes to a person like every agent. The app stays up until the
  # chain ends.
  - id: app_up
    type: service
    run_if: $screenshots
    service: $app
    description: "bring the project's app up for screenshots"
    on_success: shoot
    on_fail: { to: redact, max: 1 }

  - id: shoot
    type: agent
    agent: photographer
    run_if: $screenshots
    max_turns: 30
    description: "screenshot what the change shows, in the project's browser"
    input:
      ticket:  { from: run.ticket, type: ticket }
      plan:    { from: artifacts/plan.md, type: file }
      changes: { from: run.git.diff_target, type: changeset }
      app:     { from: run.service.$app, type: link }
      failure: { from: edge.failure, type: failure, optional: true }
    output:
      shots:   { to: artifacts/shots/, type: files }
    on_success: redact
    on_fail: { to: shoot, max: 1, then: debug }

  - id: redact
    type: agent
    agent: redactor
    max_turns: 15
    description: "write the merge request description"
    input:
      ticket:  { from: run.ticket, type: ticket }
      changes: { from: run.git.diff_target, type: changeset }
      shots:   { from: artifacts/shots/, type: files, optional: true }
      failure: { from: edge.failure, type: failure, optional: true }
    output:
      body:    { to: artifacts/mr.md, type: file }
    on_success: push
    on_fail: { to: redact, max: 1, then: debug }

  # push_branch records what it pushed: a later push of this branch (after a
  # rebase) is leased against it, never blind. Refused = someone else wrote to
  # the branch, which is a human's call.
  - id: push
    type: action
    action: push_branch
    on_success: mr
    on_fail: debug

  # The merge request opens, and the issue moves to its in-review status
  # right after. A tracker hiccup is not worth stopping for: best effort.
  # Then the phase ends and the run is in review: the watchers below keep
  # the merge request healthy, and the outcomes end the run.
  - id: mr
    type: action
    action: create_mr
    input:
      body:        { from: artifacts/mr.md, type: file }
      attachments: { from: artifacts/shots/, type: files, optional: true }
    with:
      labels: $mr_labels
    on_success: in_review

  - id: in_review
    type: action
    action: ticket_transition
    with: { to: in_review }
    description: "move the ticket's tracker issue to its in-review status"
    on_fail: end

watchers:
  # The target moved under the merge request. How a fix begins is the
  # project's call ($conflicts_start): by itself, after asking in the inbox
  # (the default), or only by hand. Declined, it is offered again only when
  # the target moves. A round ends with `end`: back to waiting for the merge.
  - id: conflicts
    on: { signal: mr_conflicts, start: $conflicts_start }
    description: "merge the target branch in, resolve, re-test, push"
    stages:
      - id: sync
        type: action
        action: sync_target
        with: { strategy: merge }
        description: "the engine merges the target in; a conflict pauses the merge with the files named"
        on_success: sync_test
        on_fail: { to: resolve, max: 6, then: debug }

      - id: resolve
        type: agent
        agent: resolver
        max_turns: 30
        description: "remove the conflict markers, keeping both intents — no git"
        input:
          plan:     { from: artifacts/plan.md, type: file }
          conflict: { from: edge.failure, type: failure, optional: true }
        on_success: sync
        on_fail: debug

      - id: sync_test
        type: command
        run_ref: $verify
        on_success: sync_push
        on_fail: debug

      - id: sync_push
        type: action
        action: push_branch
        on_success: end
        on_fail: debug

  # Reviewers commented, then nothing for an hour: someone reviewed and
  # stopped. You pick which pending threads to fix (inbox) — a comment may be
  # wrong or already handled; those are left alone until someone writes on
  # them again — and the picked ones are fixed in one batch and answered.
  # As many rounds as the reviewers need: a round runs only on comments no
  # round has answered yet, and the run's budget bounds what they cost.
  - id: review_fixes
    on: { signal: mr_review_settled, start: $review_start, quiet_for: 1h }
    description: "fix every pending review thread, test, push, and reply on each"
    stages:
      - id: load
        type: action
        action: load_review_comments
        with: { select: human }
        output:
          review: { to: artifacts/review.md, type: file }

      - id: fix
        type: agent
        agent: builder
        max_turns: 60
        description: "address every review thread"
        input:
          ticket:   { from: run.ticket, type: ticket }
          plan:     { from: artifacts/plan.md, type: file }
          comments: { from: artifacts/review.md, type: file }
          failure:  { from: edge.failure, type: failure, optional: true }
        on_success: fix_commit_msg
        on_fail: { to: fix, max: 2, then: debug }

      - id: fix_commit_msg
        type: agent
        agent: committer
        max_turns: 10
        input:
          ticket:  { from: run.ticket, type: ticket }
          changes: { from: run.git.status, type: changeset }
          plan:    { from: artifacts/plan.md, type: file }
          failure: { from: edge.failure, type: failure, optional: true }
        output:
          message: { to: artifacts/commit.json, type: commit_message }
        on_success: fix_commit
        on_fail: { to: fix_commit_msg, max: 1, then: debug }

      # Commits in the merge request's own checkout.
      - id: fix_commit
        type: action
        action: commit
        input:
          message: { from: artifacts/commit.json, type: commit_message }
        on_success: fix_test
        on_fail: debug

      - id: fix_test
        type: command
        run_ref: $verify
        on_success: fix_push
        on_fail: { to: fix, max: 3, then: debug }

      - id: fix_push
        type: action
        action: push_branch
        on_success: reply
        on_fail: debug

      - id: reply
        type: agent
        agent: replier
        max_turns: 15
        description: "answer each thread with what was done"
        input:
          comments: { from: artifacts/review.md, type: file }
          changes:  { from: run.git.diff_phase, type: changeset }
          failure:  { from: edge.failure, type: failure, optional: true }
        output:
          replies:  { to: artifacts/replies.yaml, type: review_replies }
        on_success: post
        on_fail: { to: reply, max: 1, then: debug }

      - id: post
        type: action
        action: reply_review_comments
        input:
          replies: { from: artifacts/replies.yaml, type: review_replies }
        on_success: end

  # A CI check failed on the merge request's head. The agent is told which
  # job and step failed — not the log — and reproduces it in the workspace.
  # Once per head and set of failed checks: the fix's push is a new head, so
  # the round is not reopened by its own failure until CI fails on it again.
  - id: ci_fix
    on: { signal: ci_failed, start: $ci_start }
    description: "reproduce the failed CI job locally, fix it, test, push"
    stages:
      - id: ci_repair
        type: agent
        agent: ci_fixer
        max_turns: 60
        description: "run the failed job's steps, fix what they report"
        input:
          plan:    { from: artifacts/plan.md, type: file }
          ci:      { from: run.ci.failure, type: failure }
          failure: { from: edge.failure, type: failure, optional: true }
        on_success: ci_commit_msg
        on_fail: { to: ci_repair, max: 2, then: debug }

      - id: ci_commit_msg
        type: agent
        agent: committer
        max_turns: 10
        input:
          ticket:  { from: run.ticket, type: ticket }
          changes: { from: run.git.status, type: changeset }
          plan:    { from: artifacts/plan.md, type: file }
          failure: { from: edge.failure, type: failure, optional: true }
        output:
          message: { to: artifacts/commit.json, type: commit_message }
        on_success: ci_commit
        on_fail: { to: ci_commit_msg, max: 1, then: debug }

      - id: ci_commit
        type: action
        action: commit
        input:
          message: { from: artifacts/commit.json, type: commit_message }
        on_success: ci_test
        on_fail: debug

      - id: ci_test
        type: command
        run_ref: $verify
        on_success: ci_push
        on_fail: { to: ci_repair, max: 3, then: debug }

      - id: ci_push
        type: action
        action: push_branch
        on_success: end
        on_fail: debug

outcomes:
  # ---- outcomes: once, and the run is over --------------------------------
  # Merged: the ticket is done, and so is the run. The tracker is best
  # effort here too — a hiccup moving the issue never un-finishes the work.
  - id: merged
    on: mr_merged
    description: "every merge request merged — the ticket is done, the run is done"
    stages:
      - id: ticket_done
        type: action
        action: ticket_transition
        with: { to: done }
        description: "move the ticket's tracker issue to its done status"
        on_fail: done

  - id: closed
    on: mr_closed
    then: abort
    description: "a merge request closed unmerged — the ticket goes back to to-do, the run is abandoned"
    stages:
      - id: ticket_back
        type: action
        action: ticket_transition
        with: { to: todo }
        description: "move the ticket's tracker issue back to its to-do status"
        on_fail: abort
